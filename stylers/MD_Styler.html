<!DOCTYPE html>
<html lang="en">
<head>

<script>
  // Anti-flash theming: applied before first paint so returning visitors
  // never see a flicker of the default light/teal theme before their
  // saved dark mode / accent color kicks in.
  (function(){
    try{
      var t = localStorage.getItem('mdStyler:theme');
      if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      var a = localStorage.getItem('mdStyler:accent');
      if(a){
        document.documentElement.style.setProperty('--accent', a);
      }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --paper:#F3F4EE;
    --rule:#E1E4DA;
    --ink:#212A38;
    --muted:#6B7280;
    --yellow:#FFD34D;
    --highlight-bg:rgba(255,211,77,.38);
    --highlight-fg:inherit;
    --accent:#2F9C95;
    --accent-fill:#2F9C95;
    --accent-2:#E8556E;
    --accent-3:#3E5C76;
    --accent-grad:#E8556E;
    --card:#FFFFFF;
    --stamp:#212A38;
    --stamp-fg:#FFD34D;
    --note-bg:#FFF9E5;
    --note-fg:#5c4a1f;
    --code-bg:#EFF1EA;
    --code-fg:#B14D5F;
    --zebra:#FAFAF6;
    --input-bg:#FBFBF8;
    --accent-soft:rgba(47,156,149,.10);
    --accent-line:rgba(47,156,149,.24);
    --accent-wash:rgba(47,156,149,.055);
    --accent-button:#2F9C95;
    --accent-button-fg:#FFFFFF;
  }
  [data-theme="dark"]{
    --paper:#1B1C17;
    --rule:#2B2D26;
    --ink:#ECEAE2;
    --muted:#9A9C93;
    --yellow:#FFD34D;
    --highlight-bg:rgba(255,211,77,.16);
    --highlight-fg:#F1EFE6;
    --accent:#3DBDB3;
    --accent-fill:#3DBDB3;
    --accent-2:#FF7A90;
    --accent-3:#5C7C9C;
    --accent-grad:#FF7A90;
    --card:#222420;
    --stamp:#FFD34D;
    --stamp-fg:#1B1C17;
    --note-bg:#332C16;
    --note-fg:#F3D9A0;
    --code-bg:#2A2C24;
    --code-fg:#FF8FA3;
    --zebra:#262820;
    --input-bg:#1E201B;
    --accent-soft:rgba(61,189,179,.10);
    --accent-line:rgba(61,189,179,.20);
    --accent-wash:rgba(61,189,179,.045);
    --accent-button:#3DBDB3;
    --accent-button-fg:#132321;
  }
  *{box-sizing:border-box;}
  ::selection{ background:var(--accent-fill); color:#fff; }
  button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 31px, var(--accent-line) 31px, var(--accent-line) 32px
      ),
      var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }

  .app{ max-width:840px; margin:0 auto; padding:20px 20px 80px; }

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
    padding:18px 0 22px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark-link{ text-decoration:none; display:block; }
  .brand-mark{
    width:40px; height:40px; border-radius:10px;
    background:var(--accent-button); color:var(--accent-button-fg);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
    transform:rotate(-4deg);
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .brand-mark-link:hover .brand-mark{ transform:rotate(-4deg) scale(1.06); background:var(--accent-fill); color:#fff; }
  .brand h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:1.5rem;
    margin:0; letter-spacing:-0.01em;
  }
  .brand p{ margin:2px 0 0; font-size:0.82rem; color:var(--muted); }

  .actions{ display:flex; align-items:center; gap:8px; position:relative; }
  .btn{
    font-family:'Source Sans 3', sans-serif; font-weight:600; font-size:0.85rem;
    padding:9px 14px; border-radius:8px; border:1.5px solid var(--ink);
    background:var(--card); color:var(--ink); cursor:pointer;
    transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover{ transform:translateY(-1px); border-color:var(--accent); }
  .btn:active{ transform:translateY(0); }
  .btn-accent{ background:var(--accent-button); color:var(--accent-button-fg); border-color:var(--accent-button); box-shadow:2px 2px 0 var(--accent-line); }

  /* ---------- Icon buttons (dark mode + accent color) ---------- */
  .iconbtn{
    width:38px; height:38px; flex-shrink:0; border-radius:8px;
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .iconbtn:hover{ transform:translateY(-1px); border-color:var(--accent); }
  .iconbtn:active{ transform:translateY(0); }
  .iconbtn svg{ width:17px; height:17px; }
  .iconbtn.active{ background:var(--accent-fill); border-color:var(--accent-fill); color:#fff; }

  .theme-wrap{ position:relative; }
  .popover{
    position:absolute; top:calc(100% + 8px); right:0; z-index:50;
    min-width:236px; background:var(--card); border:1.5px solid var(--ink);
    border-radius:12px; box-shadow:4px 4px 0 var(--accent-line); padding:14px;
    display:none; flex-direction:column; gap:10px;
    animation:popIn .14s ease-out;
    transition:background .2s ease, border-color .2s ease;
  }
  .popover.show{ display:flex; }
  @keyframes popIn{ from{ opacity:0; transform:scale(.95) translateY(-4px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .popover-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted);
  }
  .swatch-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{
    width:28px; height:28px; border-radius:8px; border:1.5px solid var(--ink);
    cursor:pointer; padding:0; position:relative; flex-shrink:0;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .swatch:hover{ transform:translateY(-2px); box-shadow:2px 2px 0 var(--rule); }
  .swatch.active::after{
    content:""; position:absolute; inset:-4px; border-radius:10px; border:1.5px solid var(--ink);
  }
  .swatch.reset{
    background:
      linear-gradient(to bottom right, transparent calc(50% - 1px), var(--muted), transparent calc(50% + 1px)),
      var(--card);
  }
  .swatch.custom-toggle{
    background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink);
    border-style:dashed;
  }
  .swatch.custom-toggle svg{ width:14px; height:14px; }
  .custom-row{ display:none; gap:6px; }
  .custom-row.show{ display:flex; }
  .custom-row input{
    flex:1; min-width:0; padding:7px 9px; border:1.5px solid var(--accent-line); border-radius:7px;
    font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:var(--ink); background:var(--input-bg);
    outline:none; transition:border-color .12s ease;
  }
  .custom-row input:focus{ border-color:var(--accent); }
  .custom-row input.invalid{ border-color:#D64550; }

  /* Editor panel */
  .editor-panel{
    background:var(--card); border:1.5px solid var(--ink); border-radius:12px;
    padding:16px; margin-bottom:20px;
    box-shadow:4px 4px 0 var(--ink);
    transition:background .2s ease, border-color .2s ease;
  }
  .editor-panel.hidden{ display:none; }
  .editor-panel label{
    display:block; font-size:0.78rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); margin-bottom:8px;
  }
  #mdInput{
    width:100%; min-height:220px; resize:vertical;
    font-family:'IBM Plex Mono', monospace; font-size:0.85rem; line-height:1.55;
    border:1.5px solid var(--rule); border-radius:8px; padding:12px;
    background:var(--input-bg); color:var(--ink);
    transition:background .2s ease, border-color .15s ease, color .2s ease;
  }
  #mdInput:focus{ outline:none; border-color:var(--accent); }
  .editor-actions{
    display:flex; align-items:center; gap:12px; margin-top:10px;
  }
  .hint{ font-size:0.78rem; color:var(--muted); }

  /* Sheet / prose */
  .sheet{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:14px;
    box-shadow:6px 6px 0 var(--ink);
    padding:8px;
    transition:background .2s ease, border-color .2s ease;
  }
  .prose{ padding:26px 26px 34px; }

  .prose h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:2rem;
    margin:0 0 4px; letter-spacing:-0.02em; line-height:1.15;
  }
  .prose > h1:first-child + p em,
  .prose h1 + p{ color:var(--muted); font-size:0.95rem; margin-top:0; }

  .prose h1::after{
    content:""; display:block; width:64px; height:4px; margin-top:10px;
    background:linear-gradient(90deg, var(--accent), var(--accent-grad));
    border-radius:4px;
  }

  .prose h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.3rem;
    margin:34px 0 14px; padding:6px 14px;
    display:inline-block; border-radius:6px 6px 6px 0;
    color:#fff; position:relative;
  }
  .prose h2:nth-of-type(3n+1){ background:var(--accent-fill); }
  .prose h2:nth-of-type(3n+2){ background:var(--accent-2); }
  .prose h2:nth-of-type(3n+3){ background:var(--accent-3); }

  .prose h3{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem;
    margin:22px 0 10px; color:var(--ink);
  }
  .prose h3::before{ content:"▍ "; color:var(--accent); }

  .prose p{ line-height:1.65; margin:10px 0; font-size:0.97rem; }

  .prose strong{
    background:linear-gradient(180deg, transparent 55%, var(--highlight-bg) 55%);
    color:var(--highlight-fg);
    padding:0 1px; font-weight:650;
    box-decoration-break:clone; -webkit-box-decoration-break:clone;
  }

  .prose ul, .prose ol{ padding-left:1.3em; margin:10px 0; }
  .prose li{ line-height:1.6; margin:5px 0; font-size:0.96rem; }
  .prose ul > li::marker{ color:var(--accent-2); }
  .prose ol > li::marker{ color:var(--accent); font-weight:600; }

  .prose table{
    width:100%; border-collapse:collapse; margin:16px 0;
    font-size:0.88rem; border-radius:8px; overflow:hidden;
    border:1px solid var(--rule);
  }
  .prose thead th{
    background:var(--accent-button); color:var(--accent-button-fg); text-align:left;
    padding:9px 12px; font-weight:600; font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem; letter-spacing:.02em;
  }
  .prose tbody td{
    padding:9px 12px; border-top:1px solid var(--rule);
    font-family:'IBM Plex Mono', monospace; font-size:0.83rem;
  }
  .prose tbody tr:nth-child(even){ background:var(--accent-wash); }

  .prose blockquote{
    background:var(--note-bg); border:1.5px dashed var(--accent-2); border-radius:8px;
    padding:12px 16px; margin:16px 4px; font-size:0.9rem;
    color:var(--note-fg); transform:rotate(-0.4deg);
  }
  .prose blockquote p{ margin:0; }

  .prose hr{
    border:none; margin:30px 0;
    background-image:radial-gradient(circle, var(--muted) 1.5px, transparent 1.5px);
    background-size:10px 2px; background-repeat:repeat-x; height:2px;
    opacity:.5;
  }

  .prose code{
    font-family:'IBM Plex Mono', monospace; background:var(--code-bg);
    padding:1px 6px; border-radius:4px; font-size:0.85em; color:var(--code-fg);
  }

  /* Fenced code blocks */
  .code-wrap{
    position:relative; margin:16px 0; border:1px solid var(--rule);
    border-radius:10px; overflow:hidden; background:#0d1117;
  }
  .code-wrap pre{
    margin:0; padding:16px; overflow:auto; -webkit-overflow-scrolling:touch;
    font:0.84rem/1.65 'IBM Plex Mono', monospace; tab-size:2;
  }
  .code-wrap pre code{
    display:block; padding:0; background:transparent; color:inherit;
    border-radius:0; font-size:inherit; white-space:pre;
  }
  .code-toolbar{
    display:flex; justify-content:flex-end; gap:8px; padding:7px 9px;
    border-bottom:1px solid rgba(255,255,255,.09); background:#161b22;
  }
  .copy-code{
    border:1px solid rgba(255,255,255,.18); border-radius:6px;
    background:transparent; color:#c9d1d9; padding:5px 9px; cursor:pointer;
    font:600 .72rem 'Source Sans 3',sans-serif;
  }
  .copy-code:hover{ border-color:var(--accent); color:#fff; }

  /* KaTeX-like/MathJax comfort */
  mjx-container[display="true"]{
    overflow-x:auto; overflow-y:hidden; padding:5px 2px; max-width:100%;
  }
  mjx-container{ font-size:1.03em; }
  .prose img{ max-width:100%; height:auto; border-radius:8px; }
  .prose a{ color:var(--accent); overflow-wrap:anywhere; }
  .prose pre{ max-width:100%; }

  footer.credit{
    text-align:center; color:var(--muted); font-size:0.75rem; margin-top:18px;
  }

  @media (max-width:700px){
    .app{ width:100%; max-width:none; padding:12px 10px 48px; }
    .topbar{ align-items:flex-start; padding:10px 0 14px; gap:10px; }
    .brand{ min-width:0; flex:1 1 100%; }
    .brand h1{ font-size:1.22rem; }
    .brand p{ font-size:.76rem; }
    .brand-mark{ width:36px; height:36px; font-size:18px; }
    .actions{ width:100%; display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:7px; }
    .actions .btn{ min-height:42px; padding:8px 10px; font-size:.79rem; }
    .iconbtn{ width:42px; height:42px; }
    .theme-wrap{ position:static; }
    .popover{
      position:fixed; left:10px; right:10px; top:auto; bottom:10px;
      width:auto; min-width:0; max-height:60vh; overflow:auto;
      box-shadow:0 8px 30px rgba(0,0,0,.28);
    }
    .editor-panel{ padding:12px; margin-bottom:14px; }
    #mdInput{ min-height:42vh; font-size:.82rem; }
    .editor-actions{ flex-wrap:wrap; gap:8px; }
    .sheet{ border-radius:10px; box-shadow:3px 3px 0 var(--ink); }
    .prose{ padding:18px 14px 24px; min-width:0; overflow-wrap:anywhere; }
    .prose h1{ font-size:1.5rem; }
    .prose h2{ font-size:1.12rem; max-width:100%; margin-top:26px; }
    .prose p,.prose li{ font-size:.94rem; }
    .prose table{ display:block; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; }
    .prose blockquote{ margin-left:0; margin-right:0; }
    .code-wrap{ margin-left:0; margin-right:0; }
    .code-wrap pre{ padding:13px; font-size:.77rem; }
    .hint{ flex:1 1 100%; }
    body{ overflow-x:hidden; }
  }
  @media (max-width:380px){
    .actions{ grid-template-columns:1fr 42px 42px; }
    .actions .btn-accent{ font-size:.74rem; }
    .prose{ padding-left:12px; padding-right:12px; }
  }

  @media print{
    /* Printed output always uses the light "cram sheet" palette, no
       matter which theme/accent is active on screen — dark backgrounds
       waste ink and dark-mode text is unreadable on white paper.
       (The JS beforeprint/afterprint handlers below strip the inline
       accent overrides so these resets can actually take effect.) */
    :root, [data-theme="dark"]{
      --paper:#fff; --rule:#E1E4DA; --ink:#212A38; --muted:#6B7280;
      --yellow:#FFD34D; --highlight-bg:rgba(255,211,77,.38); --highlight-fg:inherit; --accent:#2F9C95; --card:#fff;
      --accent-fill:#2F9C95; --accent-2:#E8556E; --accent-3:#3E5C76; --accent-grad:#E8556E;
      --stamp:#212A38; --stamp-fg:#FFD34D;
      --note-bg:#FFF9E5; --note-fg:#5c4a1f;
      --code-bg:#EFF1EA; --code-fg:#B14D5F;
      --zebra:#FAFAF6; --input-bg:#FBFBF8;
      --accent-soft:rgba(47,156,149,.09); --accent-line:rgba(47,156,149,.18); --accent-wash:rgba(47,156,149,.035); --accent-button:#2F9C95; --accent-button-fg:#fff;
    }
    body{ background:#fff; }
    .topbar, .editor-panel{ display:none !important; }
    .sheet{ box-shadow:none; border:none; }
    .prose h2{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .prose thead th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .prose blockquote{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>

      <textarea id="mdInput" spellcheck="false"># Part A: Listening and Speaking

## 1. Hearing vs Listening; Tips for Active/Effective Listening

**Hearing** is a passive, physiological process — sound waves reaching the ear and being registered by the brain, without conscious effort. It happens automatically and continuously.

**Listening** is an active, psychological process. It involves receiving, interpreting, evaluating, and responding to what is heard. It requires attention, concentration, and understanding of meaning — not just sound.

| Hearing | Listening |
|---|---|
| Passive, involuntary | Active, voluntary |
| Only physical (ears) | Physical + mental (ears + brain + attention) |
| No effort needed | Requires focus and effort |
| No understanding required | Involves understanding and interpretation |

**Tips for Active/Effective Listening:**
1. **Pay full attention** – Face the speaker, maintain eye contact, avoid distractions (phone, side conversations).
2. **Show you are listening** – Use nods, appropriate facial expressions, and verbal cues like "I see," "go on."
3. **Avoid interrupting** – Let the speaker finish their point before responding.
4. **Don't judge prematurely** – Listen fully before forming opinions or conclusions.
5. **Ask questions/clarify** – Paraphrase or ask for clarification to confirm understanding ("So you mean...?").
6. **Give feedback** – Respond appropriately, showing you understood the message.
7. **Listen for the main idea**, not just isolated words.
8. **Control emotional reactions** – Stay open-minded even if you disagree.

---

## 2. Barriers to Active/Effective Listening

1. **Physical barriers** – Noise, poor acoustics, bad connection (in calls), physical discomfort.
2. **Psychological barriers** – Prejudice, preconceived notions, or bias toward the speaker or topic.
3. **Physiological barriers** – Hearing impairment, fatigue, illness.
4. **Language barriers** – Unfamiliar vocabulary, accent differences, jargon.
5. **Attitudinal barriers** – Lack of interest, boredom, or a closed mind.
6. **Emotional barriers** – Anger, stress, or personal problems affecting focus.
7. **Selective listening** – Hearing only what one wants to hear and ignoring the rest.
8. **Information overload** – Too much information at once, causing loss of focus.
9. **Multitasking/Distractions** – Trying to listen while doing something else.
10. **Cultural differences** – Different norms of communication causing misinterpretation.

> Tip: To overcome these, minimize noise, stay open-minded, focus fully, and practice patience.

---

## 3. Ways to Improve One's English Speaking Skills

1. **Practice daily** – Speak English regularly, even alone (self-talk, describing your day).
2. **Read aloud** – Improves pronunciation, fluency, and intonation.
3. **Build vocabulary** – Learn new words daily and use them in sentences.
4. **Listen actively** – Watch English movies, news, podcasts to pick up natural expressions and accent.
5. **Think in English** – Reduces the habit of translating from your native language.
6. **Focus on pronunciation** – Practice difficult sounds; use dictionaries with audio.
7. **Converse with others** – Join English-speaking groups, discussions, or language partners.
8. **Don't fear mistakes** – Speak confidently even if imperfect; fluency comes with practice.
9. **Record and review yourself** – Identify areas of improvement (grammar, pace, clarity).
10. **Learn grammar in context** – Rather than isolated rules, learn through usage.
11. **Use language learning apps/resources** for structured practice.

---

## 4. Effective Public Speaking Techniques

1. **Know your audience** – Tailor content, tone, and language to who you're addressing.
2. **Prepare and organize content** – Clear introduction, body, and conclusion.
3. **Practice thoroughly** – Rehearse multiple times, ideally aloud and in front of others.
4. **Use a confident tone and clear voice** – Vary pitch and pace to maintain interest; avoid monotone.
5. **Maintain eye contact** – Builds connection and confidence with the audience.
6. **Use body language effectively** – Natural gestures, good posture, purposeful movement.
7. **Manage nervousness** – Deep breathing, positive visualization, and pausing when needed.
8. **Use visual aids wisely** – Slides, charts, or props to support (not overwhelm) the message.
9. **Engage the audience** – Ask questions, use stories/examples, encourage interaction.
10. **Be concise and clear** – Avoid jargon; stick to the main point.
11. **Have a strong opening and closing** – Hook attention at the start; end with a memorable takeaway.

# Part B: Grammar

## 1. Avoiding Run-on Sentences, Comma Splices, and Fragments

**Run-on Sentence:** Two or more independent clauses joined without proper punctuation or a conjunction.
- ❌ *I love reading books I read every night.*
- ✅ *I love reading books. I read every night.*
- ✅ *I love reading books, and I read every night.*

**How to fix run-ons:**
- Split into two sentences using a period.
- Join with a comma + coordinating conjunction (FANBOYS: for, and, nor, but, or, yet, so).
- Join with a semicolon (;).
- Use a subordinating conjunction to make one clause dependent.

**Comma Splice:** Two independent clauses joined only by a comma, with no conjunction.
- ❌ *She was tired, she went to sleep.*
- ✅ *She was tired, so she went to sleep.*
- ✅ *She was tired; she went to sleep.*
- ✅ *She was tired. She went to sleep.*

**How to fix comma splices:**
- Replace the comma with a period or semicolon.
- Add a coordinating conjunction after the comma.
- Turn one clause into a dependent clause (e.g., "Because she was tired, she went to sleep.")

**Sentence Fragment:** An incomplete sentence — missing a subject, verb, or complete thought; cannot stand alone.
- ❌ *Because I was late.* (dependent clause with no main clause)
- ❌ *Running to the store.* (no subject/main verb)
- ✅ *Because I was late, I missed the bus.*
- ✅ *I was running to the store.*

**How to fix fragments:**
- Attach the fragment to a related independent clause.
- Add the missing subject or verb to make it a complete thought.

> Summary Rule: A complete sentence needs at least one independent clause (subject + verb + complete thought). Combine ideas correctly using periods, semicolons, commas + conjunctions, or subordination — never just a comma alone between two full sentences.

---

## 2. Conditional Sentences: If Clauses and Wish

Conditional sentences express a condition and its result, using **if-clauses**.

**Zero Conditional** (general truths/facts): *If + present simple, present simple*
- *If you heat water to 100°C, it boils.*

**First Conditional** (real/possible future situations): *If + present simple, will + base verb*
- *If it rains tomorrow, I will stay home.*

**Second Conditional** (unreal/hypothetical present or future): *If + past simple, would + base verb*
- *If I won the lottery, I would travel the world.*
- *If I were you, I would apologize.* (note: "were" for all subjects in formal use)

**Third Conditional** (unreal past — hypothetical situations that didn't happen): *If + past perfect, would have + past participle*
- *If she had studied harder, she would have passed the exam.*

**Mixed Conditional** (mixing past condition with present result, or vice versa):
- *If I had saved money then, I would be rich now.*

**Using "Wish"** – expresses a desire for something different from reality.

1. **Wish + past simple** → regret about present situation
   - *I wish I knew the answer.* (I don't know it now)
2. **Wish + past perfect** → regret about past situation
   - *I wish I had studied harder.* (I didn't study)
3. **Wish + would + base verb** → wanting someone/something to change (often annoyance)
   - *I wish you would stop shouting.*
4. **Wish + were** (for hypothetical present, especially with "I"/"he"/"she")
   - *I wish I were taller.*

> Note: Both if-clauses and wish use backshifted (past) tenses to express unreality — a present wish uses past tense, and a past regret uses past perfect tense.

<script>
  const input = document.getElementById('mdInput');
  const preview = document.getElementById('preview');
  const editorPanel = document.getElementById('editorPanel');
  const STORAGE_KEY = 'mdStyler:lastPaste';

  function debounce(fn, wait){
    let t;
    return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };
  }

  // Marked configuration: GitHub-ish Markdown + fenced code, while preserving
  // raw LaTeX delimiters so MathJax can typeset them after Markdown renders.
  marked.setOptions({
    gfm: true,
    breaks: false,
    mangle: false,
    headerIds: true,
    highlight(code, lang) {
      if (window.hljs && lang && hljs.getLanguage(lang)) {
        try { return hljs.highlight(code, {language: lang}).value; } catch(e) {}
      }
      return window.hljs ? hljs.highlightAuto(code).value : code;
    }
  });

  const renderer = new marked.Renderer();
  renderer.code = function(code, infostring) {
    const raw = typeof code === 'object' ? code.text : code;
    const lang = (infostring || '').trim().split(/\s+/)[0];
    const escapeHtml = (text) => text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;');
    let html = escapeHtml(raw);
    let cls = '';
    if (window.hljs) {
      try {
        const result = lang && hljs.getLanguage(lang)
          ? hljs.highlight(raw, {language:lang})
          : hljs.highlightAuto(raw);
        html = result.value;
        cls = ' class="language-' + (lang || 'plaintext') + ' hljs"';
      } catch(e) {}
    }
    return '<div class="code-wrap">' +
      '<div class="code-toolbar"><button class="copy-code" type="button">Copy</button></div>' +
      '<pre><code' + cls + '>' + html + '</code></pre></div>';
  };

  marked.use({ renderer });

  function render(){
    try{
      preview.innerHTML = marked.parse(input.value);
      preview.querySelectorAll('.copy-code').forEach(btn => {
        btn.addEventListener('click', async () => {
          const code = btn.closest('.code-wrap')?.querySelector('code')?.textContent || '';
          try{
            await navigator.clipboard.writeText(code);
            const old = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = old, 1200);
          }catch(e){
            btn.textContent = 'Copy failed';
            setTimeout(() => btn.textContent = 'Copy', 1200);
          }
        });
      });
      if (window.MathJax?.typesetPromise) {
        MathJax.typesetClear?.([preview]);
        MathJax.typesetPromise([preview]).catch(()=>{});
      }
    }catch(e){
      preview.innerHTML = '<p style="color:#B14D5F">Could not render — check your Markdown formatting.</p>';
    }
  }

  function saveToStorage(){
    try{ localStorage.setItem(STORAGE_KEY, input.value); }catch(e){}
  }

  // restore last pasted text, if any — otherwise the preset sample stays as-is
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null && saved.trim() !== '') input.value = saved;
  }catch(e){}

  input.addEventListener('input', debounce(render, 200));
  input.addEventListener('input', debounce(saveToStorage, 400));
  document.getElementById('renderBtn').addEventListener('click', render);

  document.getElementById('toggleEditor').addEventListener('click', ()=>{
    editorPanel.classList.toggle('hidden');
  });

  document.getElementById('printBtn').addEventListener('click', ()=> window.print());

  render();

  // ---------- Dark mode (persisted) ----------
  // data-theme may already have been set by the anti-flash script in <head>
  // if a saved preference exists; here we just wire up the toggle button.
  const darkBtn = document.getElementById('darkBtn');
  function setDarkActive(){
    darkBtn.classList.toggle('active', document.documentElement.getAttribute('data-theme') === 'dark');
  }
  setDarkActive();
  darkBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('mdStyler:theme', next); }catch(e){}
    setDarkActive();
    refreshAccentVar(); // tint ranges & the theme's own default accent differ per theme
  });

  // ---------- Accent color system (persisted) ----------
  const PRESET_ACCENTS = ['#2F9C95', '#4A3AFF', '#E14C86', '#2E9E5B', '#E2A63A', '#3E5C76'];
  let customAccentHex = null;
  try{ customAccentHex = localStorage.getItem('mdStyler:accent') || null; }catch(e){}

  function hexToRgb(hex){
    hex = hex.replace('#','');
    return { r: parseInt(hex.substring(0,2),16), g: parseInt(hex.substring(2,4),16), b: parseInt(hex.substring(4,6),16) };
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
  }
  // Auto-detects hex ("#2F9C95", "2F9C95", "#2c9") or rgb()/rgba() input.
  function parseColorInput(str){
    str = (str || '').trim();
    if(!str) return null;
    const rgbMatch = str.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*(?:,\s*[\d.]+\s*)?\)$/i);
    if(rgbMatch){
      const r = +rgbMatch[1], g = +rgbMatch[2], b = +rgbMatch[3];
      if(r > 255 || g > 255 || b > 255) return null;
      return rgbToHex(r, g, b);
    }
    let hex = str.replace(/^#/, '');
    if(/^[0-9a-f]{3}$/i.test(hex)) hex = hex.split('').map(c => c + c).join('');
    if(/^[0-9a-f]{6}$/i.test(hex)) return '#' + hex.toUpperCase();
    return null;
  }

  // ---- Color theory: derive a full palette from a single accent hex ----
  // Rather than fixed preset colors for headings/gradients, every
  // secondary color on the page is computed from whichever accent the
  // user picked (preset or custom), by rotating hue around the color
  // wheel and clamping saturation/lightness into a range that stays
  // legible for its role (white text on a fill, a border on paper, etc).
  function hexToHsl(hex){
    const {r,g,b} = hexToRgb(hex);
    const rn = r/255, gn = g/255, bn = b/255;
    const max = Math.max(rn,gn,bn), min = Math.min(rn,gn,bn);
    let h, s, l = (max+min)/2;
    if(max === min){ h = s = 0; }
    else{
      const d = max - min;
      s = l > 0.5 ? d/(2-max-min) : d/(max+min);
      switch(max){
        case rn: h = (gn-bn)/d + (gn < bn ? 6 : 0); break;
        case gn: h = (bn-rn)/d + 2; break;
        default: h = (rn-gn)/d + 4;
      }
      h *= 60;
    }
    return { h, s: s*100, l: l*100 };
  }
  function hslToHex(h,s,l){
    h = ((h % 360) + 360) % 360; s = s/100; l = l/100;
    const c = (1-Math.abs(2*l-1)) * s;
    const x = c * (1 - Math.abs((h/60) % 2 - 1));
    const m = l - c/2;
    let r,g,b;
    if(h < 60){ r=c; g=x; b=0; }
    else if(h < 120){ r=x; g=c; b=0; }
    else if(h < 180){ r=0; g=c; b=x; }
    else if(h < 240){ r=0; g=x; b=c; }
    else if(h < 300){ r=x; g=0; b=c; }
    else{ r=c; g=0; b=x; }
    return rgbToHex((r+m)*255, (g+m)*255, (b+m)*255);
  }
  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }
  // WCAG-style relative luminance / contrast ratio against white text, so
  // fills that need white text on top (heading chips) stay legible no
  // matter which hue the user picks — HSL "lightness" alone isn't a
  // reliable proxy for perceived brightness (yellow/cyan read far
  // lighter than blue/red at the same L), so this checks real contrast.
  function relLuminance(hex){
    const { r, g, b } = hexToRgb(hex);
    const lin = v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
    return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  }
  function contrastWithWhite(hex){ return 1.05 / (relLuminance(hex) + 0.05); }
  // Rotate hue by an offset and clamp saturation/lightness into a range
  // tuned for a specific UI role, so any input hue still looks intentional.
  // When minContrastWhite is given, keep darkening until real contrast
  // against white text clears that ratio (falls back on plain clamping
  // for roles that don't carry white text, like the gradient bar).
  function harmonize(hex, hueOffset, range, minContrastWhite){
    const { h, s, l } = hexToHsl(hex);
    const nh = h + hueOffset;
    const ns = clamp(s, range.minS, range.maxS);
    let nl = clamp(l, range.minL, range.maxL);
    let result = hslToHex(nh, ns, nl);
    if(minContrastWhite){
      let guard = 0;
      while(contrastWithWhite(result) < minContrastWhite && nl > 4 && guard < 40){
        nl -= 2;
        result = hslToHex(nh, ns, nl);
        guard++;
      }
    }
    return result;
  }
  // Solid, saturated fills meant to sit behind white text (heading chips).
  const RANGE_FILL = { minS:55, maxS:80, minL:36, maxL:50 };
  const MIN_CONTRAST_WHITE = 4.5;
  // A little more freedom for the thin gradient bar under h1 — it never
  // carries text, so it doesn't need the contrast guard.
  const RANGE_GRAD = { minS:50, maxS:85, minL:38, maxL:58 };
  // Pale washes / readable-on-wash text for blockquotes & inline code —
  // these need to flip from light-tint-on-light-text to
  // dark-tint-on-light-text depending on the active theme.
  function tintRanges(isDark){
    return isDark
      ? { bg:{minS:28,maxS:45,minL:16,maxL:22}, fg:{minS:35,maxS:55,minL:76,maxL:86} }
      : { bg:{minS:22,maxS:42,minL:90,maxL:95}, fg:{minS:45,maxS:65,minL:22,maxL:32} };
  }
  const ACCENT_VARS = ['--accent','--accent-fill','--accent-2','--accent-3','--accent-grad','--note-bg','--note-fg','--code-bg','--code-fg','--accent-soft','--accent-line','--accent-wash','--accent-button','--accent-button-fg'];

  // Split-complementary scheme: the base accent (0°), plus two colors
  // 150°/210° around the wheel from it (i.e. ±30° from its true
  // complement). That trio reads as "designed together" for the three
  // rotating heading colors, while the h1 underline gradient goes all
  // the way to the true 180° complement for maximum contrast/pop.
  function rgbaFromHex(hex, alpha){
    const {r,g,b}=hexToRgb(hex);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function buttonForeground(hex){
    return contrastWithWhite(hex) >= 4.5 ? '#FFFFFF' : '#16211F';
  }

  function applyPalette(accentHex){
    const root = document.documentElement.style;
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const t = tintRanges(isDark);
    const rootAccent = isDark ? harmonize(accentHex, 0, {minS:50,maxS:80,minL:52,maxL:68}) : harmonize(accentHex, 0, {minS:50,maxS:80,minL:38,maxL:52});
    root.setProperty('--accent-soft', rgbaFromHex(rootAccent, isDark ? .13 : .09));
    root.setProperty('--accent-line', rgbaFromHex(rootAccent, isDark ? .22 : .18));
    root.setProperty('--accent-wash', rgbaFromHex(rootAccent, isDark ? .055 : .035));
    const button = harmonize(accentHex, 0, RANGE_FILL, MIN_CONTRAST_WHITE);
    root.setProperty('--accent-button', button);
    root.setProperty('--accent-button-fg', buttonForeground(button));
    root.setProperty('--stamp', button);
    root.setProperty('--stamp-fg', buttonForeground(button));
    root.setProperty('--rule', rgbaFromHex(rootAccent, isDark ? .13 : .16));

    root.setProperty('--accent-fill', harmonize(accentHex, 0, RANGE_FILL, MIN_CONTRAST_WHITE));
    root.setProperty('--accent-2', harmonize(accentHex, 150, RANGE_FILL, MIN_CONTRAST_WHITE));
    root.setProperty('--accent-3', harmonize(accentHex, 210, RANGE_FILL, MIN_CONTRAST_WHITE));
    root.setProperty('--accent-grad', harmonize(accentHex, 180, RANGE_GRAD));
    root.setProperty('--note-bg', harmonize(accentHex, 150, t.bg));
    root.setProperty('--note-fg', harmonize(accentHex, 150, t.fg));
    root.setProperty('--code-bg', harmonize(accentHex, 210, t.bg));
    root.setProperty('--code-fg', harmonize(accentHex, 210, t.fg));
  }
  function effectiveAccent(){
    if(customAccentHex) return customAccentHex;
    const cs = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    return cs || '#2F9C95';
  }
  function refreshAccentVar(){
    if(customAccentHex){
      document.documentElement.style.setProperty('--accent', customAccentHex);
    } else {
      document.documentElement.style.removeProperty('--accent');
    }
    applyPalette(effectiveAccent());
  }
  function applyAccent(hex){
    customAccentHex = hex;
    try{
      if(hex) localStorage.setItem('mdStyler:accent', hex);
      else localStorage.removeItem('mdStyler:accent');
    }catch(e){}
    refreshAccentVar();
    renderSwatchState();
  }
  refreshAccentVar();

  // Printing should always use the plain light "cram sheet" palette
  // (see the @media print reset) — but that reset can't win against the
  // inline custom properties we set above, so strip them just for the
  // print pass and put them back once it's done.
  window.addEventListener('beforeprint', () => {
    ACCENT_VARS.forEach(p => document.documentElement.style.removeProperty(p));
  });
  window.addEventListener('afterprint', () => { refreshAccentVar(); });

  const swatchRow = document.getElementById('swatchRow');
  const customToggleBtn = document.getElementById('customToggleBtn');
  const resetSwatch = document.getElementById('resetSwatch');

  PRESET_ACCENTS.forEach(hex => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.style.background = hex;
    b.dataset.hex = hex;
    b.title = hex;
    b.addEventListener('click', () => applyAccent(hex));
    swatchRow.insertBefore(b, customToggleBtn);
  });
  resetSwatch.addEventListener('click', () => applyAccent(null));

  function renderSwatchState(){
    swatchRow.querySelectorAll('.swatch:not(.custom-toggle)').forEach(el => {
      const hex = el.dataset.hex || null;
      el.classList.toggle('active', hex === customAccentHex);
    });
  }
  renderSwatchState();

  // Popover open/close + custom color input
  const paletteBtn = document.getElementById('paletteBtn');
  const palettePopover = document.getElementById('palettePopover');
  const customRow = document.getElementById('customRow');
  const customColorInput = document.getElementById('customColorInput');

  paletteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    palettePopover.classList.toggle('show');
  });
  document.addEventListener('click', (e) => {
    if(!palettePopover.contains(e.target) && e.target !== paletteBtn){
      palettePopover.classList.remove('show');
    }
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') palettePopover.classList.remove('show');
  });
  customToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    customRow.classList.toggle('show');
    if(customRow.classList.contains('show')){
      customColorInput.value = customAccentHex || '';
      customColorInput.focus();
    }
  });
  function tryApplyCustom(){
    const parsed = parseColorInput(customColorInput.value);
    customColorInput.classList.toggle('invalid', !!customColorInput.value.trim() && !parsed);
    if(parsed) applyAccent(parsed);
  }
  customColorInput.addEventListener('input', tryApplyCustom);
  customColorInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); tryApplyCustom(); }
  });

  // If the saved accent isn't one of the presets, it was a custom value —
  // pre-open the custom row so a returning visitor can see/edit it.
  if(customAccentHex && !PRESET_ACCENTS.includes(customAccentHex)){
    customRow.classList.add('show');
    customColorInput.value = customAccentHex;
  }
</script>
