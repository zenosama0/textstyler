<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Persona Chat</title>
<style>
:root{--bg:#313338;--side:#2b2d31;--dark:#1e1f22;--text:#dbdee1;--muted:#949ba4;--accent:#5865f2;--input:#383a40;--hover:#35373c;--avr:50%;--sp:1;--mg:14px;--rad:12px;--rads:8px;--gw:40px}
:root[data-theme=light]{--bg:#fff;--side:#f2f3f5;--dark:#e3e5e8;--text:#313338;--muted:#5c5e66;--input:#e3e5e8;--hover:#e8eaed}
:root[data-theme=amoled]{--bg:#000;--text:#e6e6e6}
:root[data-theme=forest]{--bg:#1f2a24;--side:#18211c;--dark:#111813;--text:#dfe9e2;--muted:#8fa498;--accent:#3ba55d;--input:#2a372f;--hover:#26332b}
:root[data-theme=midnight]{--bg:#0f172a;--side:#111c33;--dark:#0a1020;--text:#dbe4f5;--muted:#8393b2;--accent:#38bdf8;--input:#1b2742;--hover:#18233d}
:root[data-theme=grape]{--bg:#2a1f3d;--side:#231a33;--dark:#1a1226;--text:#eadff8;--muted:#a493c0;--accent:#c084fc;--input:#38294f;--hover:#32254a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"gg sans","Noto Sans","Segoe UI",system-ui,sans-serif;background:var(--dark);color:var(--text);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.si{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.bi{display:block;line-height:0}
body.reduce *{animation:none!important;transition:none!important}
#app{display:flex;position:fixed;left:0;right:0;top:var(--vt,0px);height:var(--vh,100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex-shrink:0;position:relative}
.ic:hover{background:var(--hover);color:var(--text)}
.ic.on{color:var(--text)}
.badge{background:#f23f42;color:#fff;border-radius:10px;font-size:12px;font-weight:700;padding:0 6px;min-width:18px;height:18px;line-height:18px;text-align:center;flex-shrink:0}
.lbl{font-size:12px;font-weight:700;color:var(--muted);padding:14px 10px 6px;text-transform:uppercase}
.empty{margin:auto;text-align:center;color:var(--muted);padding:30px;font-size:14px}
.btn{background:var(--accent);color:#fff;border-radius:var(--rads);padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.g{background:var(--input);color:var(--text)}
.btn.r{background:#da373c}
.btn .si{width:16px;height:16px}
.field{background:var(--dark);border:0;border-radius:var(--rads);padding:10px 12px;outline:0;width:100%}
.av{border-radius:var(--avr);flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:700;background-size:cover;background-position:center;user-select:none}
.avw{position:relative;flex-shrink:0}
.sd{position:absolute;right:-3px;bottom:-3px;width:36%;height:36%;min-width:10px;min-height:10px;border-radius:50%;border:3px solid var(--sdb,var(--side));background:#80848e}
.sd.online{background:#23a55a}.sd.idle{background:#f0b232}.sd.dnd{background:#f23f42}
/* left: rail + dm list */
#left{display:flex;flex-shrink:0;z-index:5;transition:transform .2s}
#rail{width:72px;background:var(--dark);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow-y:auto;flex-shrink:0;scrollbar-width:none}
.rb{position:relative;width:48px;height:48px;flex-shrink:0;display:grid;place-items:center}
.rb .av{border-radius:50%}
.rb::before{content:"";position:absolute;left:-12px;top:50%;width:8px;height:0;background:var(--text);border-radius:0 4px 4px 0;transform:translateY(-50%);transition:height .15s}
.rb.on::before{height:36px}.rb.dot::before{height:8px}
.rb .badge{position:absolute;right:-4px;bottom:-4px;border:3px solid var(--dark);box-sizing:content-box}
.home{background:var(--accent);color:#fff;border-radius:16px}
.add{background:var(--side);color:#23a55a;border-radius:50%}
.sep1{width:32px;height:2px;background:var(--side);border-radius:1px;flex-shrink:0}
#side{width:250px;background:var(--side);display:flex;flex-direction:column;min-width:0}
.sh{display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;height:52px;font-weight:700;font-size:1.05em;flex-shrink:0;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.sh span{flex:1}
#sq{margin:8px 12px;background:var(--dark);border-radius:var(--rads);display:flex;align-items:center;padding:0 10px;gap:8px;color:var(--muted);flex-shrink:0}
#sq input{flex:1;background:none;border:0;outline:0;padding:9px 0;min-width:0;color:var(--text)}
#dms{flex:1;overflow:auto;padding:4px 8px}
.dm{display:flex;align-items:center;gap:12px;width:100%;padding:calc(6px*var(--sp)) 8px;border-radius:var(--rads);color:var(--muted);text-align:left;cursor:pointer}
.dm:hover{background:var(--hover);color:var(--text)}
.dm.on{background:var(--input);color:var(--text)}
.dm.un{color:var(--text)}
.dm .cm{flex:1;min-width:0}
.dm .cm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm .cm small{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;background:var(--accent);color:#fff;border-radius:4px;padding:0 5px}
#me{--sdb:var(--dark);display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--dark);flex-shrink:0}
.nm2{flex:1;min-width:0}
.nm2 b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm2 small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#head{display:flex;align-items:center;gap:6px;padding:0 8px;height:52px;background:var(--side);flex-shrink:0}
#head .t{flex:1;font-weight:700;font-size:1.1em;display:flex;align-items:center;gap:8px;min-width:0}
#head .t span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#head .sd{position:static;width:12px;height:12px;min-width:0;min-height:0;border:0;flex-shrink:0}
#burger{display:none}
#burger .badge{position:absolute;right:-6px;top:-2px;border:2px solid var(--side);box-sizing:content-box}
#msgs{flex:1;overflow-y:auto;padding:8px 0;background-size:cover;background-position:center;display:flex;flex-direction:column}
#msgs>.m:first-child,#msgs>.sepd:first-child{margin-top:auto}
.m{padding:calc(2px*var(--sp)) 16px;position:relative;cursor:pointer}
.m:hover{background:rgba(127,127,127,.07)}
.m.first{margin-top:var(--mg)}
.m.hl{background:rgba(250,166,26,.2)}
.mr{display:flex;gap:14px}
.gut{width:var(--gw);flex-shrink:0}
.gut .av{margin-top:2px}
.gut span{display:none;font-size:11px;color:var(--muted);line-height:1.5em;white-space:nowrap}
.m:hover .gut span{display:block}
body.compact .gut{display:none}
.bd{min-width:0;flex:1}
.nm{font-weight:600;margin-right:8px}
.tm{font-size:.75em;color:var(--muted)}
.tx{white-space:pre-wrap;word-break:break-word;line-height:1.4}
.tx a{color:#00a8fc}
.tx code{background:var(--dark);padding:1px 5px;border-radius:4px;font-size:.9em}
.ed{font-size:.7em;color:var(--muted);margin-left:4px}
img.pic{display:block;max-width:min(320px,100%);max-height:320px;border-radius:var(--rad);margin-top:4px;cursor:zoom-in;-webkit-user-drag:none}
.ref{display:flex;align-items:center;gap:6px;font-size:.82em;color:var(--muted);margin:0 0 2px calc(var(--gw)/2 + 16px);padding-left:30px;position:relative;min-height:20px}
.ref::before{content:"";position:absolute;left:0;top:50%;width:24px;height:calc(50% + 6px);border-left:2px solid var(--muted);border-top:2px solid var(--muted);border-top-left-radius:8px;opacity:.7}
.ref .av{flex-shrink:0}.ref b{flex-shrink:0;color:var(--text)}
.ref span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sepd{display:flex;align-items:center;gap:10px;margin:16px 16px 4px;color:var(--muted);font-size:12px;font-weight:600}
.sepd::before,.sepd::after{content:"";flex:1;height:1px;background:var(--muted);opacity:.5}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--input);border:1px solid transparent;border-radius:8px;padding:2px 9px;font-size:15px}
.pill.on{background:color-mix(in srgb,var(--accent) 25%,transparent);border-color:var(--accent)}
.pill b{font-size:13px;font-weight:600}
#typing{height:22px;padding:0 16px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-shrink:0}
.dots i{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--text);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
#cbar{background:var(--side);flex-shrink:0;padding:8px 10px}
#prev{display:none;padding:0 4px 8px}
#prev .pv{position:relative;display:inline-block}
#prev img{height:80px;border-radius:10px;display:block}
#prev .ic{position:absolute;top:-8px;right:-8px;width:26px;height:26px;background:var(--dark)}
#replybar{display:none;align-items:center;gap:8px;padding:0 0 6px 6px;font-size:13px;color:var(--muted)}
#replybar .ex{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replybar .ic{width:28px;height:28px}
#comp{display:flex;align-items:flex-end;gap:8px}
.cb{width:40px;height:40px;border-radius:50%;background:var(--input);display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.cb:hover{color:var(--text)}
#ibox{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--input);border-radius:20px;padding-left:16px}
#inp{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;max-height:140px;padding:10px 0;line-height:20px;height:40px}
#emo{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
#emo:hover{color:var(--text)}
#send{background:var(--accent);color:#fff}
/* members */
#members{width:260px;background:var(--side);flex-shrink:0;display:none;flex-direction:column;overflow:auto}
#members.open{display:flex}
#macts{display:flex;border-bottom:1px solid var(--dark);padding:6px 4px}
#macts button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:8px 0;border-radius:8px}
#macts button:hover{color:var(--text);background:var(--hover)}
.cr{display:flex;align-items:center;gap:14px;padding:12px 16px;font-weight:600;width:100%;text-align:left}
.cr:hover{background:var(--hover)}
.cc{width:44px;height:44px;border-radius:50%;background:var(--dark);display:grid;place-items:center;flex-shrink:0;color:var(--text)}
.mem{padding:8px 16px;border-radius:0}
#mbody{padding-bottom:16px}
/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px}
.card{background:var(--side);border-radius:var(--rad);width:min(520px,100%);max-height:92%;overflow:auto;padding:18px;position:relative}
.card h2{margin:0 0 4px;font-size:20px;padding-right:36px}
.card h3{margin:18px 0 8px;font-size:13px;color:var(--muted)}
.card>.mx{position:absolute;right:10px;top:10px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.row>span{flex:1}
.qr{display:flex;gap:6px;padding:6px 4px 10px;justify-content:space-between}
.qr button{width:44px;height:44px;border-radius:50%;background:var(--input);font-size:22px;display:grid;place-items:center;color:var(--muted)}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:var(--rads);font-weight:500;text-align:left}
.it:hover{background:var(--hover)}
.it.dng{color:#f23f42}
.it .si{color:var(--muted)}.it.dng .si{color:#f23f42}
#pop{position:fixed;z-index:40;background:var(--side);border:1px solid var(--dark);border-radius:10px;padding:6px;display:grid;grid-template-columns:repeat(8,34px);gap:2px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#pop button{height:34px;font-size:20px;border-radius:6px}
#pop button:hover{background:var(--hover)}
#view{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:50;align-items:center;justify-content:center}
#view img{max-width:96%;max-height:96%}
input[type=color]{width:44px;height:32px;border:0;padding:0;background:none}
/* settings */
#settings{position:fixed;inset:0;background:var(--side);z-index:25;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#settings.open{display:flex}
#sth{display:flex;align-items:center;gap:8px;height:56px;padding:0 8px;font-weight:700;font-size:1.1em;flex-shrink:0}
#sth span{flex:1}
#stb{flex:1;overflow:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding:0 4px}
.pc{--sdb:var(--bg);background:var(--bg);margin:10px 10px 4px;border-radius:var(--rad);overflow:hidden}
.pc .ban{height:84px}
.pc .pi{padding:0 16px 14px}
.pc .big{margin-top:-40px;width:max-content;border:6px solid var(--bg);border-radius:50%;background:var(--bg)}
.pc .pn{font-size:1.4em;font-weight:700;margin-top:8px}
.pc .ph{color:var(--muted);font-size:.9em}
.pc .pb{margin-top:8px;font-size:.9em}
.sg{font-size:12px;font-weight:700;color:var(--muted);padding:calc(24px*var(--sp)) 24px 8px;text-transform:uppercase}
.li{display:flex;align-items:center;gap:16px;width:100%;padding:calc(15px*var(--sp)) 18px;text-align:left;cursor:pointer}
.li:hover{background:var(--hover)}
.li .si{color:var(--muted)}
.li .v{margin-left:auto;color:var(--muted);font-size:.9em;display:flex;align-items:center;gap:8px}
.ctl{display:flex;align-items:center;gap:14px;padding:calc(13px*var(--sp)) 18px;min-height:calc(58px*var(--sp))}
.ctl>div:first-child{flex:1;min-width:0}
.ctl small{display:block;color:var(--muted);font-size:12px}
.ctl select.field{width:auto;max-width:55%}
.ctl input[type=range]{accent-color:var(--accent);width:150px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--muted);position:relative;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:#23a55a}.sw.on::after{transform:translateX(18px)}
.sdot{width:12px;height:12px;border-radius:50%;background:#80848e;display:inline-block}
.sdot.online{background:#23a55a}.sdot.idle{background:#f0b232}.sdot.dnd{background:#f23f42}
@media(max-width:700px){
 #left{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);width:min(92%,380px);padding-top:env(safe-area-inset-top,0px)}
 #left.open{transform:none}
 #side{flex:1;width:auto}
 #burger{display:grid}
 #members{display:flex;position:fixed;inset:0 0 0 auto;width:86%;transform:translateX(100%);transition:transform .2s;z-index:5;padding-top:env(safe-area-inset-top,0px)}
 #members.open{transform:none}
}
@media(min-width:701px){.sheet .card{width:min(380px,100%)}}
.grp{background:var(--bg);border-radius:var(--rad);margin:8px 0;overflow:hidden}
.grp .it{border-radius:0}
.grp .it+.it{border-top:1px solid var(--side)}
.m.pr{background:rgba(127,127,127,.18)}
.m.pinned{box-shadow:inset 3px 0 0 #faa61a;background:rgba(250,166,26,.07)}
#popbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:var(--text);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
@keyframes up{from{transform:translateY(100%)}}
@media(pointer:coarse){.m{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
@media(max-width:700px){
 .modal{align-items:flex-end;padding:0}
 .card{width:100%;max-width:none;border-radius:16px 16px 0 0;max-height:90%;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
 .card::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--muted);opacity:.5;margin:0 auto 12px}
 .card>.mx{display:none}
 .card h2{padding-right:0}
 #pop{left:0!important;right:0;top:auto!important;bottom:0;grid-template-columns:repeat(8,1fr);border-radius:16px 16px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:50%;overflow:auto;border:0}
 #pop button{height:42px}
}
input,textarea{-webkit-user-select:text;user-select:text}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:4}
#scrim.show{opacity:1;pointer-events:auto}
.card{overscroll-behavior:contain}
.scard{background:var(--bg);border-radius:var(--rad);overflow:hidden;margin:0 10px}
.scard>*+*{border-top:1px solid var(--side)}
#settings:not(.cards) .scard{background:none;border-radius:0;margin:0}
#settings:not(.cards) .scard>*+*{border-top:0}
#settings:not(.cards) .pc{margin:0 0 6px;border-radius:0;background:var(--dark);--sdb:var(--dark)}
#settings:not(.cards) .pc .big{border-color:var(--dark);background:var(--dark)}
#epanel{display:none;flex-direction:column;background:var(--side);flex-shrink:0;border-top:1px solid var(--dark)}
#epanel.open{display:flex}
.eph{display:flex;align-items:center;gap:6px;padding:8px 10px;flex-shrink:0}
.et{height:34px;min-width:44px;padding:0 12px;border-radius:17px;color:var(--muted);font-weight:700;font-size:13px;display:grid;place-items:center}
.et.on{background:var(--input);color:var(--text)}
.eph .field{flex:1;padding:7px 14px;border-radius:17px}
.epb{flex:1;overflow-y:auto;padding:0 8px 8px;overscroll-behavior:contain}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}
.eg button{height:42px;font-size:24px;border-radius:8px}
.eg button:hover{background:var(--hover)}
.eg .lbl{grid-column:1/-1;padding:10px 4px 4px}
.gifs{columns:2;column-gap:6px}
.gifs img{width:100%;display:block;margin-bottom:6px;border-radius:var(--rads);cursor:pointer;background:var(--input);min-height:50px;break-inside:avoid;-webkit-user-drag:none}
.epm{text-align:center;color:var(--muted);font-size:13px;padding:20px 12px}
.epm .btn{margin-top:4px}
@media(max-width:700px){#scrim{display:block}#left,#members{touch-action:pan-y}}
.mc{color:var(--muted);font-weight:400;font-size:.72em;white-space:nowrap}
.pf .ban{height:84px;border-radius:var(--rad)}
.pf .big{--sdb:var(--side);margin:-40px 0 0 14px;width:max-content;border:6px solid var(--side);border-radius:50%;background:var(--side)}
.pf .pn{font-size:1.4em;font-weight:700;margin:8px 4px 0}
.pf .ph{color:var(--muted);font-size:.9em;margin:0 4px}
.pf .pcs{margin:8px 4px 0}
html,body{overscroll-behavior:none}
.modal,#settings{top:var(--vt,0px);bottom:auto;height:var(--vh,100%)}
@media(max-width:700px){
 #left,#members{top:var(--vt,0px);bottom:auto;height:var(--vh,100%)}
}
</style>
</head>
<body>
<div id="app">
 <div id="left">
  <nav id="rail" aria-label="Personas"></nav>
  <aside id="side">
   <div class="sh"><span>Direct Messages</span><button class="ic" id="newchat" title="New chat" aria-label="New chat"><span class="bi" data-i="chatplus"></span></button></div>
   <div id="sq"><span class="bi" data-i="search" data-s="18"></span><input id="dmq" placeholder="Find or start a conversation" autocomplete="off"></div>
   <div id="dms"></div>
   <div id="me"></div>
  </aside>
 </div>
 <section id="main">
  <div id="head">
   <button id="burger" class="ic" aria-label="Chats"><span class="bi" data-i="menu"></span><span class="badge" style="display:none"></span></button>

/* ---------- helpers ---------- */
function avatar(p,size){
  const d=document.createElement('div');d.className='av';d.style.width=d.style.height=size+'px';d.style.fontSize=size*.42+'px';
  if(p&&p.img)d.style.backgroundImage=`url(${p.img})`;else{d.style.background=p?p.color:'#555';d.textContent=p?p.name.trim().charAt(0).toUpperCase():'?'}
  return d;
}
function av(p,size,dot){
  const w=document.createElement('div');w.className='avw';w.style.width=w.style.height=size+'px';w.appendChild(avatar(p,size));
  if(dot&&p&&S.settings.dots){const d=document.createElement('i');d.className='sd '+(p.status||'online');w.appendChild(d)}
  return w;
}
function resize(file,max,q){
  max=max||S.settings.maxDim;q=q||S.settings.q;
  return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)});
}
const eff=m=>m.t;
function tstr(t,full){
  const s=S.settings,d=new Date(t),tm=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:!s.h24});
  return(!full||s.tfmt==='time')?tm:d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})+' '+tm;
}
function rich(t){
  let h=esc(t);const s=S.settings;
  if(s.md)h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>');
  if(s.links)h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return h;
}
function beep(){
  try{const c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(Math.max(.01,S.settings.vol*.3),c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.25);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}
}

/* ---------- theme ---------- */
function applyTheme(){
  const r=document.documentElement,st=S.settings,set=(k,v)=>r.style.setProperty(k,v);
  ['--bg','--side','--dark','--text','--accent','--input','--hover','--muted'].forEach(v=>r.style.removeProperty(v));
  r.dataset.theme=st.theme;
  if(st.theme==='custom'){const c=st.custom;
    set('--bg',c.bg);set('--side',c.side);set('--dark',`color-mix(in srgb,${c.side} 75%,#000)`);
    set('--input',`color-mix(in srgb,${c.bg} 80%,${c.text})`);set('--hover',`color-mix(in srgb,${c.bg} 90%,${c.text})`);
    set('--text',c.text);set('--muted',`color-mix(in srgb,${c.text} 55%,${c.bg})`);set('--accent',c.accent)}
  if(st.accent)set('--accent',st.accent);
  set('--avr',st.shape==='circle'?'50%':st.shape==='round'?'12px':'4px');
  set('--sp',{compact:.8,cozy:1,relaxed:1.3}[st.density]||1);
  set('--mg',{tight:'6px',normal:'14px',loose:'24px'}[st.msgGap]||'14px');
  const cr={sharp:['4px','3px'],default:['12px','8px'],round:['20px','14px']}[st.corner]||['12px','8px'];
  set('--rad',cr[0]);set('--rads',cr[1]);set('--gw',st.avsz+'px');
  $('#settings').classList.toggle('cards',!!st.scards);
  document.body.style.fontSize=st.fs+'px';
  document.body.classList.toggle('compact',!!st.compact);
  document.body.classList.toggle('reduce',!!st.reduce);
  $('#msgs').style.backgroundImage=st.wall?`linear-gradient(rgba(0,0,0,${st.dim}),rgba(0,0,0,${st.dim})),url(${st.wall})`:'';
}

/* ---------- delivery engine (typing simulation) ---------- */
let run=0;
const pending=()=>pendingFor(S.me,S.peer).sort((a,b)=>a.t-b.t);
function typeTime(m){
  const s=S.settings;if(s.instant)return 0;
  const ms=(m.text?m.text.length*s.speed:900)+(m.img?900:0);
  return Math.max(s.min*1000,Math.min(s.max*1000,ms))*(0.9+Math.random()*.2);
}
function startQueue(){
  const tok=++run;setTyping(null);
  (async()=>{
    await sleep(S.settings.instant?0:500);
    while(tok===run){
      const p=pending();if(!p.length){setTyping(null);return}
      const s=S.settings;
      if(s.typing&&!s.instant)setTyping(p[0].from);
      await sleep(typeTime(p[0]));
      if(tok!==run)return;
      p[0].dl=p[0].dl||{};p[0].dl[S.me]=Date.now();save();setTyping(null);renderMsgs();renderSide();renderRail();
      if(s.sound)beep();
      await sleep(s.instant?0:s.pause*(0.7+Math.random()*.6));
    }
  })();
}
function setTyping(id){
  const el=$('#typing');
  el.innerHTML=id&&P(id)?`<span class="dots"><i></i><i></i><i></i></span><b>${esc(P(id).name)}</b> is typing...`:'';
  if(id){const b=$('#msgs');b.scrollTop=b.scrollHeight}
}

/* ---------- chat model ---------- */
let replyTo=null,editing=null,dmq='',membersOpen=innerWidth>900,attached=null;
const mob=()=>innerWidth<=700;
const G=id=>(S.groups||[]).find(g=>g.id===id);
const T=id=>P(id)||G(id);
const isG=id=>!!G(id);
const gname=g=>g.name||g.members.filter(i=>i!==S.me).map(i=>P(i)?P(i).name:'').filter(Boolean).join(', ')||'Group';
const tname=id=>{const g=G(id);return g?gname(g):(P(id)?P(id).name:'')};
const chatsOf=id=>(S.chats[id]=S.chats[id]||[]);
const hasChat=(a,b)=>chatsOf(a).some(c=>c.id===b);
const addChat=(a,b)=>{if(a&&b&&a!==b&&!isG(a)&&!isG(b)&&!hasChat(a,b))chatsOf(a).push({id:b,t:Date.now()})};
const between=(a,b)=>S.msgs.filter(m=>isG(b)?m.to===b:((m.from===a&&m.to===b)||(m.from===b&&m.to===a)));
const seen=(m,a)=>m.from===a||!!(m.dl&&m.dl[a]);
const vis=(a,b)=>between(a,b).filter(m=>seen(m,a)).sort((x,y)=>x.t-y.t);
const pendingFor=(a,b)=>between(a,b).filter(m=>!seen(m,a));
const unread=(a,b)=>pendingFor(a,b).length;
const totalUnread=id=>chatsOf(id).reduce((n,c)=>n+(T(c.id)?unread(id,c.id):0),0);
const act=(a,b)=>between(a,b).reduce((t,m)=>Math.max(t,m.t),0);
const excerpt=m=>m?(m.text?m.text.slice(0,80):(m.gif?'GIF':'Attachment')):'';
function seed(){
  const mk=(name,i)=>({id:uid(),name,handle:name.toLowerCase(),bio:'',cs:'',status:'online',img:null,color:COLORS[i],banner:COLORS[i],created:Date.now()});
  S.personas=[mk('Alex',0),mk('Sam',1)];S.me=S.personas[0].id;S.peer=S.personas[1].id;
}
function migrate(){
  S.settings=Object.assign(defSettings(),S.settings||{});
  S.chats=S.chats||{};S.last=S.last||{};S.recent=S.recent||[];S.groups=S.groups||[];
  S.personas.forEach(p=>{p.status=p.status||'online';p.created=p.created||Date.now();p.banner=p.banner||p.color||'#5865f2';p.handle=p.handle||'';p.bio=p.bio||'';p.cs=p.cs||''});
  S.groups.forEach(g=>{g.members=(g.members||[]).filter(i=>P(i));g.color=g.color||'#f0b232';g.img=g.img||null;g.name=g.name||''});
  S.groups=S.groups.filter(g=>g.members.length>=2);
  S.msgs=S.msgs.filter(m=>P(m.from)&&(P(m.to)||G(m.to)));
  S.msgs.forEach(m=>{if(!m.dl)m.dl=(m.delivered&&P(m.to))?{[m.to]:m.delivered}:{}});
  if(P(S.me)&&T(S.peer)&&S.me!==S.peer)addChat(S.me,S.peer);
  S.msgs.forEach(m=>{if(!isG(m.to)){addChat(m.from,m.to);addChat(m.to,m.from)}});
  S.groups.forEach(g=>g.members.forEach(i=>{if(!hasChat(i,g.id))chatsOf(i).push({id:g.id,t:g.created||Date.now()})}));
  Object.keys(S.chats).forEach(k=>{if(!P(k))delete S.chats[k];else S.chats[k]=S.chats[k].filter(c=>P(c.id)||(G(c.id)&&G(c.id).members.includes(k)))});
  if(!P(S.me))S.me=S.personas[0]?S.personas[0].id:null;
  if(!S.me||!T(S.peer)||!hasChat(S.me,S.peer))S.peer=null;
}

/* ---------- rendering ---------- */
function renderRail(){
  const r=$('#rail');r.innerHTML='';

  r.insertAdjacentHTML('beforeend','<div class="sep1"></div>');
  S.personas.forEach(p=>{
    const n=S.settings.badges?totalUnread(p.id):0;
    const b=document.createElement('button');b.className='rb'+(p.id===S.me?' on':n?' dot':'');b.title=p.name;b.setAttribute('aria-label','Chat as '+p.name);
    b.appendChild(avatar(p,48));
    if(n)b.insertAdjacentHTML('beforeend',`<span class="badge">${n}</span>`);
    b.onclick=()=>setMe(p.id);r.appendChild(b);
  });
  const a=document.createElement('button');a.className='rb add';a.title='New persona';a.setAttribute('aria-label','New persona');a.innerHTML=ico('plus',24);a.onclick=()=>editPersona();r.appendChild(a);
  const n=S.me&&S.settings.badges?totalUnread(S.me):0,bg=$('#burger .badge');bg.textContent=n;bg.style.display=n?'':'none';
}
function gavatar(g,size){
  const d=document.createElement('div');d.className='av';d.style.width=d.style.height=size+'px';
  if(g.img)d.style.backgroundImage=`url(${g.img})`;else{d.style.background=g.color||'#f0b232';d.innerHTML=ico('users',Math.round(size*.5))}

function tav(t,size,dot){

  const w=document.createElement('div');w.className='avw';w.style.width=w.style.height=size+'px';w.appendChild(gavatar(t,size));return w;
}
function dmRow(t,existing){
  const me=S.me,g=!!t.members,v=vis(me,t.id),last=v[v.length-1],n=existing&&S.settings.badges?unread(me,t.id):0;
  const b=document.createElement('button');b.className='dm'+(t.id===S.peer?' on':'')+(n?' un':'');
  b.appendChild(tav(t,40,true));
  let sub=g?t.members.length+' Members':(t.cs||'');

let lpT=null,lastLP=0;
function bindPress(d,m){
  let sx=0,sy=0;
  const stop=()=>{clearTimeout(lpT);d.classList.remove('pr')};
  d.addEventListener('pointerdown',e=>{
    if(e.button>0||e.target.closest('a,.pill,.ref'))return;
    sx=e.clientX;sy=e.clientY;d.classList.add('pr');clearTimeout(lpT);
    lpT=setTimeout(()=>{d.classList.remove('pr');lastLP=Date.now();try{getSelection().removeAllRanges()}catch(_){}try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}actionSheet(m)},450);
  });
  d.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)stop()});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>d.addEventListener(t,stop));
  d.addEventListener('contextmenu',e=>{e.preventDefault();if(Date.now()-lastLP>700){lastLP=Date.now();stop();actionSheet(m)}});
}

async function fetchGifs(prov,key,q){
  const n=S.settings.gifN;
  if(prov==='klipy'){
    const u=`https://api.klipy.com/api/v1/${encodeURIComponent(key)}/gifs/${q?'search':'trending'}?${q?'q='+encodeURIComponent(q)+'&':''}per_page=${n}&customer_id=persona-chat`;
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);const j=await r.json();
    const arr=(j.data&&Array.isArray(j.data.data)?j.data.data:Array.isArray(j.data)?j.data:j.results)||[];
    return arr.map(x=>{const f=[];(function w(o){if(!o)return;if(typeof o==='string'){if(/^https?:\/\/\S+\.(gif|webp)(\?\S*)?$/i.test(o))f.push(o)}else if(typeof o==='object')Object.values(o).forEach(w)})(x);return f.length?{u:f[0],p:f[f.length-1],t:x.title||''}:null}).filter(Boolean);
  }
  const u=`https://api.giphy.com/v1/gifs/${q?'search':'trending'}?api_key=${encodeURIComponent(key)}&limit=${n}&rating=${S.settings.rating}${q?'&q='+encodeURIComponent(q):''}`;
  const r=await fetch(u);if(!r.ok)throw new Error(r.status);const j=await r.json();
  return(j.data||[]).map(x=>({u:x.images.original.url,p:x.images.fixed_width.url,t:x.title}));
}
async function loadGifs(q){
  const body=$('#epb');if(!body)return;

    body.querySelector('#gk').onclick=()=>{closeEP(false);openSettings('gifs')};return;

}

/* ---------- swipe to close (sheets, drawers) ---------- */
function swipe(el,o){
  let sx=0,sy=0,act=false,drag=false,cur=0,pts=[];
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||(o.can&&!o.can(e))){act=false;return}
    act=true;drag=false;cur=0;sx=e.touches[0].clientX;sy=e.touches[0].clientY;pts=[[Date.now(),sx,sy]];
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!act)return;
    const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    const main=o.dir==='down'?dy:o.dir==='left'?-dx:dx,along=o.dir==='down'?Math.abs(dx):Math.abs(dy);
    if(!drag){
      if(Math.abs(main)<8&&along<8)return;
      if(main<=0||along>main||(o.scroller&&o.scroller.scrollTop>0)){act=false;return}
      drag=true;if(o.start)o.start();
    }
    if(e.cancelable)e.preventDefault();
    cur=Math.max(0,main);pts.push([Date.now(),t.clientX,t.clientY]);if(pts.length>6)pts.shift();
    o.move(cur);
  },{passive:false});
  const end=()=>{
    if(!act||!drag){act=false;return}
    act=false;drag=false;
    const a=pts[0],b=pts[pts.length-1],dt=Math.max(1,b[0]-a[0]);
    const dist=o.dir==='down'?b[2]-a[2]:o.dir==='left'?a[1]-b[1]:b[1]-a[1];
    if(cur>o.size()*.35||dist/dt>.5)o.close();else o.reset();
  };
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);
}
function finishDrag(sel){const e=$(sel),c=$('#scrim');e.style.transition='';e.style.transform='';c.style.transition='';c.style.opacity=''}
function dragStart(sel){$(sel).style.transition='none';$('#scrim').style.transition='none'}
swipe($('#left'),{dir:'left',can:mob,size:()=>$('#left').offsetWidth,
  start:()=>dragStart('#left'),
  move(d){$('#left').style.transform=`translateX(${-d}px)`;$('#scrim').style.opacity=Math.max(0,1-d/$('#left').offsetWidth)},
  close(){finishDrag('#left');setLeft(false)},reset(){finishDrag('#left')}});
swipe($('#members'),{dir:'right',can:mob,size:()=>$('#members').offsetWidth,
  start:()=>dragStart('#members'),
  move(d){$('#members').style.transform=`translateX(${d}px)`;$('#scrim').style.opacity=Math.max(0,1-d/$('#members').offsetWidth)},
  close(){finishDrag('#members');membersOpen=false;applyPanels()},reset(){finishDrag('#members')}});

[['#left','left'],['#members','right']].forEach(([sel,dir])=>{
  swipe($('#scrim'),{dir,can:()=>mob()&&(sel==='#left'?$('#left').classList.contains('open'):membersOpen),size:()=>$(sel).offsetWidth,
    start:()=>dragStart(sel),
    move(d){$(sel).style.transform=`translateX(${dir==='left'?-d:d}px)`;$('#scrim').style.opacity=Math.max(0,1-d/$(sel).offsetWidth)},
    close(){finishDrag(sel);if(sel==='#left')setLeft(false);else{membersOpen=false;applyPanels()}},reset(){finishDrag(sel)}});
});
(function(){
  const main=$('#main');let sx=0,sy=0,act=false,drag=false,mode='',cur=0,pts=[];
  const elOf=()=>$(mode==='left'?'#left':'#members');
  main.addEventListener('touchstart',e=>{
    if(!mob()||e.touches.length!==1||e.target.closest('#cbar,#epanel,input,textarea')||$('#left').classList.contains('open')||membersOpen){act=false;return}
    act=true;drag=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;pts=[[Date.now(),sx]];
  },{passive:true});
  main.addEventListener('touchmove',e=>{
    if(!act)return;
    const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(!drag){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      if(Math.abs(dy)>=Math.abs(dx)){act=false;return}
      mode=dx>0?'left':'right';drag=true;
      elOf().style.transition='none';$('#scrim').style.transition='none';$('#scrim').classList.add('show');
    }
    if(e.cancelable)e.preventDefault();
    const el=elOf(),W=el.offsetWidth;cur=Math.min(W,Math.abs(dx));
    pts.push([Date.now(),t.clientX]);if(pts.length>6)pts.shift();
    el.style.transform=`translateX(${mode==='left'?-W+cur:W-cur}px)`;$('#scrim').style.opacity=W?cur/W:1;
  },{passive:false});
  const end=()=>{
    if(!act||!drag){act=false;return}
    act=false;drag=false;
    const W=elOf().offsetWidth,a=pts[0],b=pts[pts.length-1],v=(mode==='left'?b[1]-a[1]:a[1]-b[1])/Math.max(1,b[0]-a[0]);
    finishDrag(mode==='left'?'#left':'#members');
    if(cur>W*.35||v>.5){if(mode==='left')setLeft(true);else{membersOpen=true;applyPanels()}}else syncScrim();
  };
  main.addEventListener('touchend',end);main.addEventListener('touchcancel',end);
})();

}

const THEMES=[['discord','Discord dark'],['amoled','AMOLED black'],['light','Light'],['forest','Forest'],['midnight','Midnight'],['grape','Grape'],['custom','Custom']];
const PAGES={
 appearance:{t:'Appearance',i:'palette',c:[
  {t:'h',l:'Theme'},
  {k:'theme',l:'Theme',t:'select',o:THEMES},
  {t:'colors',if:s=>s.theme==='custom'},
  {k:'accent',l:'Accent color override',d:'Overrides the theme accent',t:'color'},
  {t:'h',l:'Layout'},
  {k:'density',l:'Spacing',d:'Space around rows and list items',t:'select',o:[['compact','Compact'],['cozy','Cozy'],['relaxed','Relaxed']]},
  {k:'msgGap',l:'Message spacing',d:'Space between groups of messages',t:'select',o:[['tight','Tight'],['normal','Normal'],['loose','Loose']]},
  {k:'avsz',l:'Avatar size',t:'select',num:1,o:[[32,'Small'],[40,'Medium'],[48,'Large']]},
  {k:'shape',l:'Avatar shape',t:'select',o:[['circle','Circle'],['round','Rounded square'],['square','Square']]},
  {k:'corner',l:'Corner style',d:'Buttons, cards and sheets',t:'select',o:[['sharp','Sharp'],['default','Default'],['round','Round']]},
  {k:'fs',l:'Chat font size',t:'range',min:12,max:22,step:1,u:' px'},
  {k:'compact',l:'Hide avatars',d:'Text-only chat',t:'toggle'},
  {k:'scards',l:'Card style settings',d:'Group settings into rounded cards',t:'toggle'},
  {t:'h',l:'Chat'},
  {k:'dots',l:'Show status dots',t:'toggle'},
  {t:'wall'}]},
 text:{t:'Text & Images',i:'image',c:[
  {t:'h',l:'Messages'},
  {k:'tfmt',l:'Message timestamps',t:'select',o:[['full','Date and time'],['time','Time only'],['off','Hidden']]},
  {k:'h24',l:'24-hour clock',t:'toggle'},
  {k:'seps',l:'Date separators',t:'toggle'},
  {k:'cnames',l:'Use persona colors for names',t:'toggle'},
  {t:'h',l:'Content'},
  {k:'links',l:'Make links clickable',t:'toggle'},
  {k:'md',l:'Format text',d:'**bold**, *italic*, ~~strike~~ and `code`',t:'toggle'},
  {t:'h',l:'Images'},
  {k:'maxDim',l:'Largest image size',d:'Applies to new images',t:'select',num:1,o:[[800,'800 px'],[1000,'1000 px'],[1600,'1600 px'],[2400,'2400 px']]},
  {k:'q',l:'Image quality',d:'Applies to new images',t:'range',min:.4,max:.95,step:.05,pct:1}]},
 gifs:{t:'GIFs',i:'film',c:[
  {t:'h',l:'Provider'},
  {k:'provider',l:'GIF provider',d:'Tenor closed its API in June 2026',t:'select',o:[['giphy','GIPHY'],['klipy','KLIPY']]},
  {k:'giphyKey',l:'GIPHY API key',d:'Free key at developers.giphy.com',t:'text',ph:'Paste key'},
  {k:'klipyKey',l:'KLIPY API key',d:'Free key at klipy.com/developers',t:'text',ph:'Paste key'},
  {t:'h',l:'Results'},
  {k:'rating',l:'Content rating',d:'GIPHY only',t:'select',o:[['g','G'],['pg','PG'],['pg-13','PG-13'],['r','R']]},
  {k:'gifN',l:'GIFs per search',t:'range',min:10,max:50,step:5}]},
 behavior:{t:'Behavior',i:'clock',c:[
  {t:'h',l:'Typing simulation'},
  {k:'typing',l:'Show typing indicator',t:'toggle'},
  {k:'instant',l:'Instant delivery',d:'Skip all typing delays',t:'toggle'},
  {k:'min',l:'Minimum typing time',t:'range',min:0,max:10,step:.5,u:' s'},
  {k:'max',l:'Maximum typing time',t:'range',min:1,max:30,step:.5,u:' s'},
  {k:'speed',l:'Typing speed',d:'Time per character',t:'range',min:10,max:250,step:5,u:' ms'},
  {k:'pause',l:'Pause between messages',t:'range',min:0,max:3000,step:50,u:' ms'},
  {t:'h',l:'Input'},
  {k:'enter',l:'Enter key sends',d:'Desktop keyboards only',t:'toggle'},
  {k:'confirm',l:'Confirm before deleting',t:'toggle'}]},
 notif:{t:'Notifications',i:'bell',c:[
  {k:'badges',l:'Unread badges',t:'toggle'},
  {k:'sound',l:'Message sound',d:'Plays when a message arrives',t:'toggle'},
  {k:'vol',l:'Sound volume',t:'range',min:.05,max:1,step:.05,pct:1}]},
 access:{t:'Accessibility',i:'access',c:[
  {k:'reduce',l:'Reduce motion',t:'toggle'},
  {k:'fs',l:'Chat font size',t:'range',min:12,max:22,step:1,u:' px'},
  {k:'density',l:'Spacing',t:'select',o:[['compact','Compact'],['cozy','Cozy'],['relaxed','Relaxed']]}]}
};
const HOME=[
 ['User settings',[['status','Set Status','smile'],['personas','My Personas','users'],['profile','User Profile','edit']]],
 ['App settings',[['appearance'],['text'],['gifs'],['behavior'],['notif'],['access']]],
 ['Data',[['backup','Backup and Restore','down'],['about','About','info']]]
];
let settingsOpen=false,stPage='home';
function openSettings(page){settingsOpen=true;stPage=page||'home';$('#settings').classList.add('open');renderSettings()}
function closeSettings(){settingsOpen=false;$('#settings').classList.remove('open');$('#settings').innerHTML=''}
function setS(k,v){
  const s=S.settings;s[k]=v;
  if(k==='min'&&s.max<v)s.max=v;
  if(k==='max'&&s.min>v)s.min=v;
  save();refresh();
}
function ctl(c){
  const s=S.settings,row=document.createElement('div');row.className='ctl';
  const lab=`<div>${esc(c.l||'')}${c.d?`<small>${esc(c.d)}</small>`:''}</div>`;
  if(c.t==='toggle'){
    row.innerHTML=lab+`<button class="sw${s[c.k]?' on':''}" role="switch" aria-checked="${!!s[c.k]}" aria-label="${esc(c.l)}"></button>`;
    row.style.cursor='pointer';row.onclick=()=>{setS(c.k,!s[c.k]);renderSettings()};
  }else if(c.t==='select'){
    const cur=(c.o.find(([v])=>String(v)===String(s[c.k]))||c.o[0])[1];
    row.innerHTML=lab+`<span class="v" style="color:var(--muted);display:flex;align-items:center;gap:6px">${esc(cur)}${ico('chev',18)}</span>`;
    row.style.cursor='pointer';row.onclick=()=>pickSheet(c.l,c.o,s[c.k],v=>{setS(c.k,v);renderSettings()});
  }else if(c.t==='range'){
    const f=v=>c.pct?Math.round(v*100)+'%':v+(c.u||'');
    row.innerHTML=lab+`<input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${s[c.k]}"><span style="min-width:52px;text-align:right;color:var(--muted)">${f(s[c.k])}</span>`;
    const r=row.querySelector('input'),v=row.querySelector('span');
    r.oninput=()=>{setS(c.k,+r.value);v.textContent=f(+r.value)};r.onchange=()=>renderSettings();
  }else if(c.t==='color'){
    row.innerHTML=lab+`<input type="color" value="${s[c.k]||'#5865f2'}"><button class="btn g">Reset</button>`;
    row.querySelector('input').oninput=e=>setS(c.k,e.target.value);
    row.querySelector('button').onclick=()=>{setS(c.k,'');renderSettings()};
  }else if(c.t==='text'){
    row.style.display='block';
    row.innerHTML=lab+`<input class="field" style="margin-top:8px" value="${esc(s[c.k]||'')}" placeholder="${esc(c.ph||'')}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    row.querySelector('input').oninput=e=>{s[c.k]=e.target.value.trim();save()};
  }else if(c.t==='colors'){
    row.style.display='block';
    row.innerHTML=[['bg','Chat background'],['side','Sidebars'],['text','Text'],['accent','Accent']].map(([k,n])=>`<div class="row"><span>${n}</span><input type="color" data-c="${k}" value="${s.custom[k]}"></div>`).join('');
    row.querySelectorAll('input').forEach(i=>i.oninput=e=>{s.custom[i.dataset.c]=e.target.value;save();refresh()});
  }else if(c.t==='wall'){
    row.style.display='block';
    row.innerHTML=`<div>Chat wallpaper<small>Image behind the messages (stored on this device)</small></div><div class="row"><button class="btn g" id="wu">${ico('up')} Upload</button><button class="btn g" id="wr">Remove</button></div>
     <div class="row"><span>Dim wallpaper</span><input type="range" min="0" max="0.9" step="0.05" value="${s.dim}" style="accent-color:var(--accent);width:150px"></div><input type="file" accept="image/*" hidden>`;
    const f=row.querySelector('input[type=file]');
    row.querySelector('#wu').onclick=()=>f.click();
    f.onchange=async e=>{const fl=e.target.files[0];if(fl){setS('wall',await resize(fl,1600,.7))}};
    row.querySelector('#wr').onclick=()=>setS('wall',null);
    row.querySelector('input[type=range]').oninput=e=>setS('dim',+e.target.value);
  }
  return row;
}
function liRow(icon,label,val,fn){
  const b=document.createElement('button');b.className='li';b.innerHTML=ico(icon)+`<span>${esc(label)}</span>`+(val!=null?`<span class="v">${val}${ico('chev',18)}</span>`:`<span class="v">${ico('chev',18)}</span>`);
  b.onclick=fn;return b;
}
function download(name,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function renderSettings(){
  if(!settingsOpen)return;
  const root=$('#settings'),keep=root.querySelector('#stb')?root.querySelector('#stb').scrollTop:0,home=stPage==='home',pg=PAGES[stPage];
  const names={status:'Set Status',personas:'My Personas',backup:'Backup and Restore',about:'About'};
  root.classList.toggle('cards',!!S.settings.scards);
  root.innerHTML=`<div id="sth"><button class="ic" id="sback" aria-label="${home?'Close':'Back'}">${ico(home?'x':'back')}</button><span>${home?'User Settings':names[stPage]||pg.t}</span></div><div id="stb"><div class="wrap" id="sw"></div></div>`;
  const w=root.querySelector('#sw'),mp=P(S.me);
  const card=()=>{const c=document.createElement('div');c.className='scard';w.appendChild(c);return c};
  const sect=t=>w.insertAdjacentHTML('beforeend',`<div class="sg">${t}</div>`);
  root.querySelector('#sback').onclick=()=>{if(home)closeSettings();else{stPage='home';renderSettings()}};
  if(home){
    if(mp){
      const days=Math.max(0,Math.floor((Date.now()-(mp.created||Date.now()))/864e5));
      w.insertAdjacentHTML('beforeend',`<div class="pc"><div class="ban" style="background:${esc(mp.banner||mp.color)}"></div><div class="pi"><div class="big"></div><div class="pn">${esc(mp.name)}</div><div class="ph">@${esc(mp.handle||mp.name.toLowerCase().replace(/\s+/g,''))}</div>${mp.bio?`<div class="pb">${esc(mp.bio)}</div>`:''}<div class="pb">Persona created: ${days} day${days===1?'':'s'} ago</div></div></div>`);
      w.querySelector('.big').appendChild(av(mp,80,true));
    }
    HOME.forEach(([title,items])=>{
      sect(title);const c=card();
      items.forEach(([k,label,icon])=>{
        const p=PAGES[k];let val=null;
        if(k==='status'&&mp)val=`<i class="sdot ${mp.status}"></i>${statusLabel(mp.status)}`;
        c.appendChild(liRow(icon||p.i,label||p.t,val,()=>{if(k==='profile'){if(mp)editPersona(mp.id)}else{stPage=k;renderSettings()}}));
      });
    });
  }else if(stPage==='status'){
    if(!mp)w.innerHTML='<div class="empty">Create a persona first.</div>';
    else{
      sect('Status for '+esc(mp.name));let c=card();
      STATUS.forEach(([k,n])=>{
        const b=document.createElement('button');b.className='li';b.innerHTML=`<i class="sdot ${k}"></i><span>${n}</span>`+(mp.status===k?`<span class="v" style="color:var(--accent)">Selected</span>`:'');
        b.onclick=()=>{mp.status=k;save();refresh();renderSettings()};c.appendChild(b);
      });
      sect('Custom status');c=card();
      c.innerHTML='<div class="ctl"><input class="field" id="cs" maxlength="60" placeholder="What is on your mind?"></div>';
      const i=c.querySelector('#cs');i.value=mp.cs||'';i.oninput=()=>{mp.cs=i.value.trim();save();renderSide();renderMembers()};
    }
  }else if(stPage==='personas'){
    sect('Personas');const c=card();
    S.personas.forEach(p=>{
      const r=document.createElement('div');r.className='ctl';r.appendChild(av(p,40,true));
      r.insertAdjacentHTML('beforeend',`<div>${esc(p.name)}<small>@${esc(p.handle||p.name.toLowerCase())}</small></div><button class="ic" data-e aria-label="Edit">${ico('edit')}</button><button class="ic" data-d aria-label="Delete" style="color:#f23f42">${ico('trash')}</button>`);
      r.querySelector('[data-e]').onclick=()=>editPersona(p.id);
      r.querySelector('[data-d]').onclick=()=>ask('Delete '+p.name+'?','This also removes all of their messages.','Delete',()=>{
        const id=p.id;S.personas=S.personas.filter(x=>x.id!==id);S.msgs=S.msgs.filter(x=>x.from!==id&&x.to!==id);
        S.msgs.forEach(x=>{if(x.replyTo&&!S.msgs.some(y=>y.id===x.replyTo))x.replyTo=null;if(x.reacts)for(const k in x.reacts){x.reacts[k]=x.reacts[k].filter(i=>i!==id);if(!x.reacts[k].length)delete x.reacts[k]}});
        S.groups.forEach(g=>{g.members=g.members.filter(i=>i!==id)});S.groups.filter(g=>g.members.length<2).forEach(g=>{S.msgs=S.msgs.filter(x=>x.to!==g.id)});S.groups=S.groups.filter(g=>g.members.length>=2);delete S.chats[id];delete S.last[id];
        if(S.me===id){S.me=S.personas[0]?S.personas[0].id:null;S.peer=null}
        migrate();save();renderAll();startQueue();renderSettings();
      });
      c.appendChild(r);
    });
    const a=card();a.innerHTML=`<div class="ctl"><button class="btn">${ico('plus')} Add persona</button></div>`;a.querySelector('button').onclick=()=>editPersona();
  }else if(stPage==='backup'){
    const kb=new Blob([JSON.stringify(S)]).size/1024;
    sect('Saved on this device');let c=card();
    c.innerHTML=`<div class="ctl"><div>Stored data<small>${kb>1024?(kb/1024).toFixed(1)+' MB':Math.round(kb)+' KB'} - ${S.personas.length} personas, ${S.msgs.length} messages</small></div></div>`;
    sect('Transfer');c=card();
    c.innerHTML=`<div class="ctl" style="flex-wrap:wrap"><button class="btn g" id="ex">${ico('down')} Export</button><button class="btn g" id="im">${ico('up')} Import</button></div><input type="file" id="imf" accept="application/json" hidden>`;
    sect('Danger zone');c=card();
    c.innerHTML=`<div class="ctl" style="flex-wrap:wrap"><button class="btn r" id="cl">${ico('trash')} Clear messages</button><button class="btn r" id="rs">${ico('trash')} Reset everything</button></div>`;
    w.querySelector('#ex').onclick=()=>download('persona-chat-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S));
    w.querySelector('#im').onclick=()=>w.querySelector('#imf').click();
    w.querySelector('#imf').onchange=async e=>{
      const f=e.target.files[0];if(!f)return;
      let d;try{d=JSON.parse(await f.text());if(!Array.isArray(d.personas)||!Array.isArray(d.msgs))throw 0}catch(_){ask('Import failed','That file is not a valid Persona Chat export.','OK',null,false);return}
      ask('Replace all data?','Importing replaces everything currently saved on this device.','Import',()=>{S=Object.assign(defaults(),d);migrate();save();renderAll();startQueue();renderSettings()});
    };
    w.querySelector('#cl').onclick=()=>ask('Clear messages?','All messages in every chat will be deleted.','Clear',()=>{S.msgs=[];replyTo=null;editing=null;save();renderAll();startQueue();renderSettings()});
    w.querySelector('#rs').onclick=()=>ask('Reset everything?','All personas, messages and settings will be deleted.','Reset',()=>{S=defaults();seed();migrate();replyTo=null;editing=null;save();renderAll();startQueue();renderSettings()});
  }else if(stPage==='about'){
    sect('Persona Chat');const c=card();
    c.innerHTML='<div class="ctl"><div>Stored on this device<small>Everything is saved in this browser. Nothing is sent to a server except GIF searches you run. Use Export to move your data elsewhere.</small></div></div>';
  }else{
    let c=null;
    pg.c.forEach(x=>{
      if(x.t==='h'){sect(x.l);c=card();return}
      if(x.if&&!x.if(S.settings))return;
      if(!c)c=card();
      c.appendChild(ctl(x));
    });
  }
  root.querySelector('#stb').scrollTop=keep;
}

/* ---------- init ---------- */
(async()=>{
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ico(e.dataset.i,e.dataset.s));
  const d=await dbGet();
  S=d&&Array.isArray(d.personas)?Object.assign(defaults(),d):defaults();
  if(!S.personas.length)seed();
  migrate();save();renderAll();startQueue();
})();
</script>
