<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow — Focus Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEDEA;
    --dot:#DDDBD2;
    --chrome:#FAFAF8;
    --card:#FFFFFF;
    --ink:#1B1C1E;
    --muted:#8A8D91;
    --line:#E1E1DD;
    --accent:#2F5DE3;
    --accent-soft:#E9EEFD;
    --focus:#2F5DE3;
    --break:#2F9C6E;
    --break-soft:#E4F5EC;
    --heat-1:#C9D3F7;
    --heat-2:#9AACF0;
    --heat-3:#6B84E8;
    --heat-4:#2F5DE3;
  }
  [data-theme="dark"]{
    --bg:#17181B;
    --dot:#232529;
    --chrome:#1D1F23;
    --card:#202226;
    --ink:#EDEDEE;
    --muted:#8C9096;
    --line:#2C2E33;
    --accent:#6E93FF;
    --accent-soft:#232C45;
    --focus:#6E93FF;
    --heat-1:#2B3660;
    --heat-2:#3C4C8C;
    --heat-3:#5170C4;
    --heat-4:#6E93FF;
    --break:#3FBE85;
    --break-soft:#1B2C24;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh; color:var(--ink); font-family:'Inter', sans-serif;
    background:
      radial-gradient(var(--dot) 1px, transparent 1px) 0 0/20px 20px,
      var(--bg);
    transition:background .2s ease, color .2s ease;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    height:52px; background:var(--chrome); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 16px;
    position:sticky; top:0; z-index:40;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark-link{ text-decoration:none; display:block; }
  .brand-mark{
    width:36px; height:36px; border-radius:9px;
    background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:transform .15s ease, background .15s ease;
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-mark-link:hover .brand-mark{ transform:scale(1.06); background:var(--ink); }
  .brand h1{ font-family:'Fraunces', serif; font-weight:700; font-size:1.1rem; margin:0; }
  .brand p{ margin:0; font-size:0.74rem; color:var(--muted); }

  .tb-actions{ display:flex; align-items:center; gap:4px; position:relative; }
  .iconbtn{
    width:34px; height:34px; border-radius:8px; border:none; background:transparent;
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{ background:var(--line); }
  .iconbtn.active{ background:var(--accent); color:#fff; }
  .iconbtn svg{ width:17px; height:17px; }

  .popover{
    position:absolute; top:44px; right:0; background:var(--chrome);
    border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.16);
    padding:16px; z-index:60; display:none; width:230px;
  }
  .popover.open{ display:block; }
  .popover h4{
    margin:0 0 12px; font-size:0.7rem; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-weight:600;
  }
  .field{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:0.84rem; }
  .field input[type=number]{
    width:56px; text-align:center; border:1px solid var(--line); border-radius:6px;
    padding:5px 2px; font-family:'IBM Plex Mono',monospace; font-size:0.84rem;
    background:var(--bg); color:var(--ink);
  }
  .field input:focus{ outline:none; border-color:var(--accent); }
  .toggle{
    width:34px; height:19px; border-radius:20px; background:var(--line);
    position:relative; cursor:pointer; transition:background .15s ease; flex-shrink:0;
  }
  .toggle.on{ background:var(--accent); }
  .toggle::after{
    content:""; position:absolute; top:2px; left:2px; width:15px; height:15px;
    border-radius:50%; background:#fff; transition:left .15s ease;
  }
  .toggle.on::after{ left:17px; }

  /* ---------- Layout ---------- */
  .wrap{ max-width:640px; margin:0 auto; padding:30px 20px 70px; }

  /* ---------- Timer card ---------- */
  .timer-card{
    background:var(--card); border:1.5px solid var(--ink); border-radius:18px;
    box-shadow:5px 5px 0 var(--line); padding:34px 26px 28px;
    display:flex; flex-direction:column; align-items:center; margin-bottom:20px;
  }
  .phase-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; font-weight:600;
    text-transform:uppercase; letter-spacing:.12em; padding:5px 12px; border-radius:20px;
    margin-bottom:20px; transition:background .2s ease, color .2s ease;
  }
  .phase-label.focus{ background:var(--accent-soft); color:var(--focus); }
  .phase-label.break{ background:var(--break-soft); color:var(--break); }

  .ring-zone{ position:relative; width:230px; height:230px; margin-bottom:22px; }
  .ring-zone svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--line); stroke-width:9; }
  .ring-progress{ fill:none; stroke:var(--focus); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .2s ease; }
  .ring-progress.break{ stroke:var(--break); }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .time-display{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:2.6rem;
    letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
  }
  .session-dots{ display:flex; gap:6px; margin-top:8px; }
  .session-dots span{ width:6px; height:6px; border-radius:50%; background:var(--line); }
  .session-dots span.done{ background:var(--focus); }

  .subject-row{ width:100%; margin-bottom:18px; }
  .subject-row input{
    width:100%; text-align:center; border:1px solid var(--line); border-radius:9px;
    padding:10px 12px; font-family:'Inter',sans-serif; font-size:0.9rem;
    background:var(--bg); color:var(--ink);
  }
  .subject-row input:focus{ outline:none; border-color:var(--accent); }
  .subject-row input::placeholder{ color:var(--muted); }

  .controls{ display:flex; gap:10px; width:100%; }
  .controls button{
    flex:1; padding:13px; border-radius:12px; border:1.5px solid var(--ink);
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.9rem; cursor:pointer;
    background:var(--chrome); color:var(--ink); display:flex; align-items:center;
    justify-content:center; gap:7px;
  }
  .controls .primary{ background:var(--ink); color:var(--bg); }
  .controls button svg{ width:15px; height:15px; }

  /* ---------- Stats ---------- */
  .stats-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:20px; }
  .stat-card{
    background:var(--card); border:1.5px solid var(--ink); border-radius:12px;
    padding:14px; text-align:center; box-shadow:3px 3px 0 var(--line);
  }
  .stat-card .num{ font-family:'Fraunces',serif; font-weight:700; font-size:1.5rem; }
  .stat-card .lbl{ font-size:0.72rem; color:var(--muted); margin-top:2px; }

  .chart-card{
    background:var(--card); border:1.5px solid var(--ink); border-radius:12px;
    padding:16px 16px 12px; margin-bottom:20px; box-shadow:3px 3px 0 var(--line);
  }
  .chart-card h3{ font-family:'Fraunces',serif; font-size:0.92rem; margin:0 0 14px; }
  .bars{ display:flex; align-items:flex-end; gap:8px; height:70px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
  .bar{ width:100%; background:var(--accent-soft); border-radius:4px 4px 2px 2px; min-height:3px; transition:height .25s ease; }
  .bar.today{ background:var(--accent); }
  .bar-col span{ font-size:0.66rem; color:var(--muted); }

  .heatmap-scroll{ overflow-x:auto; padding-bottom:2px; }
  .heatmap-grid{
    display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 11px);
    gap:3px; width:max-content;
  }
  .hm-cell{ width:11px; height:11px; border-radius:2px; background:var(--line); }
  .hm-cell[data-level="1"]{ background:var(--heat-1); }
  .hm-cell[data-level="2"]{ background:var(--heat-2); }
  .hm-cell[data-level="3"]{ background:var(--heat-3); }
  .hm-cell[data-level="4"]{ background:var(--heat-4); }
  .heatmap-legend{
    display:flex; align-items:center; gap:4px; margin-top:10px;
    font-size:0.7rem; color:var(--muted);
  }
  .heatmap-legend .hm-cell{ width:10px; height:10px; }

  /* ---------- History ---------- */
  .history-toggle{
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    padding:12px 4px; user-select:none;
  }
  .history-toggle .left{ display:flex; align-items:center; gap:8px; font-size:0.86rem; font-weight:600; color:var(--muted); }
  .history-toggle svg{ width:15px; height:15px; transition:transform .15s ease; }
  .history-toggle.open svg{ transform:rotate(90deg); }
  .history-list{ display:none; flex-direction:column; gap:6px; margin-top:4px; }
  .history-list.open{ display:flex; }
  .history-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:9px 12px; font-size:0.82rem;
  }
  .history-row .subj{ font-weight:600; }
  .history-row .meta{ color:var(--muted); font-size:0.76rem; }
  .history-row .right{ display:flex; align-items:center; gap:10px; }
  .history-row .mins{ font-family:'IBM Plex Mono',monospace; color:var(--focus); font-weight:600; }
  .history-row button{
    border:none; background:transparent; color:var(--muted); cursor:pointer;
    width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  .history-row button:hover{ background:var(--line); color:var(--again, #E8556E); }
  .history-empty{ text-align:center; color:var(--muted); font-size:0.82rem; padding:20px 0; }
  .clear-history{
    font-size:0.76rem; color:var(--muted); background:none; border:none; cursor:pointer;
    text-decoration:underline; padding:0;
  }

  @media (max-width:480px){
    .ring-zone{ width:200px; height:200px; }
    .time-display{ font-size:2.2rem; }
    .stats-row{ gap:8px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <a href="../index.html" class="brand-mark-link" title="Back to Stylers hub">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        </span>
      </a>
      <div>
        <h1>StudyFlow</h1>
        <p>focus timer &amp; session log</p>
      </div>
    </div>
    <div class="tb-actions">
      <button class="iconbtn" id="settingsBtn" title="Timer settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
      <button class="iconbtn" id="darkBtn" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>

      <div class="popover" id="settingsPopover">
        <h4>Timer settings</h4>
        <div class="field"><span>Focus (min)</span><input type="number" id="focusMin" min="1" max="120" value="25"></div>
        <div class="field"><span>Short break (min)</span><input type="number" id="shortMin" min="1" max="60" value="5"></div>
        <div class="field"><span>Long break (min)</span><input type="number" id="longMin" min="1" max="90" value="15"></div>
        <div class="field"><span>Sessions till long break</span><input type="number" id="cycleCount" min="2" max="8" value="4"></div>
        <div class="field"><span>Sound</span><div class="toggle on" id="soundToggle"></div></div>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="timer-card">
      <span class="phase-label focus" id="phaseLabel">Focus</span>

      <div class="ring-zone">
        <svg viewBox="0 0 220 220">
          <circle class="ring-track" cx="110" cy="110" r="98"></circle>
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="98"></circle>
        </svg>
        <div class="ring-center">
          <div class="time-display" id="timeDisplay">25:00</div>
          <div class="session-dots" id="sessionDots"></div>
        </div>
      </div>

      <div class="subject-row">
        <input type="text" id="subjectInput" placeholder="What are you studying? (optional)">
      </div>

      <div class="controls">
        <button id="resetBtn" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 16v-4h4"/></svg>
        </button>
        <button class="primary" id="startPauseBtn">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          <span id="startPauseLabel">Start</span>
        </button>
        <button id="skipBtn" title="Skip to next phase">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>
        </button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="num" id="statToday">0m</div><div class="lbl">Today</div></div>
      <div class="stat-card"><div class="num" id="statWeek">0m</div><div class="lbl">This week</div></div>
      <div class="stat-card"><div class="num" id="statStreak">0</div><div class="lbl">Day streak</div></div>
    </div>

    <div class="chart-card">
      <h3>Last 7 days</h3>
      <div class="bars" id="bars"></div>
    </div>

    <div class="chart-card">
      <h3>Study heatmap</h3>
      <div class="heatmap-scroll">
        <div class="heatmap-grid" id="heatmapGrid"></div>
      </div>
      <div class="heatmap-legend">
        <span>Less</span>
        <span class="hm-cell" data-level="0"></span>
        <span class="hm-cell" data-level="1"></span>
        <span class="hm-cell" data-level="2"></span>
        <span class="hm-cell" data-level="3"></span>
        <span class="hm-cell" data-level="4"></span>
        <span>More</span>
      </div>
    </div>

    <div class="history-toggle" id="historyToggle">
      <div class="left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        Session history
      </div>
      <button class="clear-history" id="clearHistoryBtn">Clear</button>
    </div>
    <div class="history-list" id="historyList"></div>

  </div>

<script>
  // ---------- Persistence ----------
  const SETTINGS_KEY = 'studyflow:settings';
  const SESSIONS_KEY = 'studyflow:sessions';
  const SUBJECT_KEY = 'studyflow:lastSubject';

  function loadSettings(){
    try{
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) return Object.assign({ focusMin:25, shortMin:5, longMin:15, cycleCount:4, sound:true }, JSON.parse(raw));
    }catch(e){}
    return { focusMin:25, shortMin:5, longMin:15, cycleCount:4, sound:true };
  }
  function saveSettings(){
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}
  }
  function loadSessions(){
    try{ return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || []; }catch(e){ return []; }
  }
  function saveSessions(){
    try{ localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }catch(e){}
  }

  let settings = loadSettings();
  let sessions = loadSessions();

  // ---------- State ----------
  let phase = 'focus';        // 'focus' | 'short' | 'long'
  let sessionIndex = 0;       // completed focus sessions in current cycle
  let totalSeconds = settings.focusMin * 60;
  let remainingSeconds = totalSeconds;
  let running = false;
  let tickHandle = null;

  const timeDisplay = document.getElementById('timeDisplay');
  const phaseLabel = document.getElementById('phaseLabel');
  const ringProgress = document.getElementById('ringProgress');
  const sessionDots = document.getElementById('sessionDots');
  const subjectInput = document.getElementById('subjectInput');
  const startPauseBtn = document.getElementById('startPauseBtn');
  const startPauseLabel = document.getElementById('startPauseLabel');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');

  const RADIUS = 98;
  const CIRC = 2 * Math.PI * RADIUS;
  ringProgress.style.strokeDasharray = CIRC;
  ringProgress.style.strokeDashoffset = 0;

  subjectInput.value = localStorage.getItem(SUBJECT_KEY) || '';
  subjectInput.addEventListener('input', () => {
    try{ localStorage.setItem(SUBJECT_KEY, subjectInput.value); }catch(e){}
  });

  // ---------- Settings UI ----------
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPopover = document.getElementById('settingsPopover');
  const focusMinInput = document.getElementById('focusMin');
  const shortMinInput = document.getElementById('shortMin');
  const longMinInput = document.getElementById('longMin');
  const cycleCountInput = document.getElementById('cycleCount');
  const soundToggle = document.getElementById('soundToggle');

  focusMinInput.value = settings.focusMin;
  shortMinInput.value = settings.shortMin;
  longMinInput.value = settings.longMin;
  cycleCountInput.value = settings.cycleCount;
  soundToggle.classList.toggle('on', settings.sound);

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsPopover.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.popover') && !e.target.closest('#settingsBtn')) settingsPopover.classList.remove('open');
  });
  [focusMinInput, shortMinInput, longMinInput, cycleCountInput].forEach(el => {
    el.addEventListener('change', () => {
      settings.focusMin = Math.max(1, parseInt(focusMinInput.value, 10) || 25);
      settings.shortMin = Math.max(1, parseInt(shortMinInput.value, 10) || 5);
      settings.longMin = Math.max(1, parseInt(longMinInput.value, 10) || 15);
      settings.cycleCount = Math.max(2, parseInt(cycleCountInput.value, 10) || 4);
      saveSettings();
      renderDots();
      if (!running) resetPhase(phase, true);
    });
  });
  soundToggle.addEventListener('click', () => {
    settings.sound = !settings.sound;
    soundToggle.classList.toggle('on', settings.sound);
    saveSettings();
  });

  // ---------- Chime ----------
  function chime(){
    if (!settings.sound) return;
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [660, 880].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.18);
        gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + i * 0.18 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.18 + 0.5);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.18);
        osc.stop(ctx.currentTime + i * 0.18 + 0.55);
      });
    }catch(e){}
  }

  // ---------- Phase helpers ----------
  function phaseMinutes(p){
    if (p === 'focus') return settings.focusMin;
    if (p === 'short') return settings.shortMin;
    return settings.longMin;
  }
  function phaseName(p){
    if (p === 'focus') return 'Focus';
    if (p === 'short') return 'Short break';
    return 'Long break';
  }

  function renderDots(){
    sessionDots.innerHTML = '';
    for (let i = 0; i < settings.cycleCount; i++){
      const dot = document.createElement('span');
      if (i < sessionIndex) dot.classList.add('done');
      sessionDots.appendChild(dot);
    }
  }

  function updateRing(){
    const fraction = remainingSeconds / totalSeconds;
    ringProgress.style.strokeDashoffset = CIRC * (1 - fraction);
  }

  function updateDisplay(){
    const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
    const s = Math.floor(remainingSeconds % 60).toString().padStart(2, '0');
    timeDisplay.textContent = m + ':' + s;
    document.title = running ? `${m}:${s} · ${phaseName(phase)} — StudyFlow` : 'StudyFlow — Focus Timer';
    updateRing();
  }

  function setPhaseVisuals(){
    const isFocus = phase === 'focus';
    phaseLabel.textContent = phaseName(phase);
    phaseLabel.classList.toggle('focus', isFocus);
    phaseLabel.classList.toggle('break', !isFocus);
    ringProgress.classList.toggle('break', !isFocus);
  }

  function resetPhase(p, keepPaused){
    phase = p;
    totalSeconds = phaseMinutes(p) * 60;
    remainingSeconds = totalSeconds;
    setPhaseVisuals();
    updateDisplay();
    renderDots();
    if (keepPaused){ stopTicking(); running = false; syncButton(); }
  }

  // ---------- Timer engine ----------
  function stopTicking(){
    if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }
  function syncButton(){
    playIcon.style.display = running ? 'none' : 'block';
    pauseIcon.style.display = running ? 'block' : 'none';
    startPauseLabel.textContent = running ? 'Pause' : (remainingSeconds < totalSeconds ? 'Resume' : 'Start');
  }

  function tick(){
    remainingSeconds--;
    if (remainingSeconds <= 0){
      remainingSeconds = 0;
      updateDisplay();
      completePhase();
      return;
    }
    updateDisplay();
  }

  function completePhase(){
    stopTicking();
    running = false;
    chime();

    if (phase === 'focus'){
      logSession(phaseMinutes('focus'));
      sessionIndex++;
      const goingLong = sessionIndex >= settings.cycleCount;
      resetPhase(goingLong ? 'long' : 'short', false);
      if (goingLong) sessionIndex = 0;
    } else {
      resetPhase('focus', false);
    }
    renderDots();
    syncButton();
    refreshStats();
  }

  function logSession(minutes){
    const now = new Date();
    sessions.push({
      date: localDateStr(now),
      subject: subjectInput.value.trim() || 'Untitled session',
      minutes,
      timestamp: now.getTime()
    });
    saveSessions();
  }

  function localDateStr(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // ---------- Controls ----------
  document.getElementById('startPauseBtn').addEventListener('click', () => {
    if (running){
      stopTicking();
      running = false;
    } else {
      running = true;
      tickHandle = setInterval(tick, 1000);
    }
    syncButton();
    updateDisplay();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    resetPhase(phase, true);
  });

  document.getElementById('skipBtn').addEventListener('click', () => {
    stopTicking();
    running = false;
    if (phase === 'focus'){
      // skipping a focus phase doesn't log a completed session
      sessionIndex++;
      const goingLong = sessionIndex >= settings.cycleCount;
      resetPhase(goingLong ? 'long' : 'short', true);
      if (goingLong) sessionIndex = 0;
    } else {
      resetPhase('focus', true);
    }
    renderDots();
  });

  document.addEventListener('keydown', (e) => {
    if (document.activeElement === subjectInput || document.activeElement.tagName === 'INPUT') return;
    if (e.key === ' '){ e.preventDefault(); document.getElementById('startPauseBtn').click(); }
  });

  // ---------- Stats ----------
  const statToday = document.getElementById('statToday');
  const statWeek = document.getElementById('statWeek');
  const statStreak = document.getElementById('statStreak');
  const barsEl = document.getElementById('bars');

  function fmtMinutes(total){
    if (total >= 60){
      const h = Math.floor(total / 60), m = total % 60;
      return h + 'h' + (m ? ' ' + m + 'm' : '');
    }
    return total + 'm';
  }

  function refreshStats(){
    const today = localDateStr(new Date());
    const byDate = {};
    sessions.forEach(s => { byDate[s.date] = (byDate[s.date] || 0) + s.minutes; });

    statToday.textContent = fmtMinutes(byDate[today] || 0);

    const days = [];
    for (let i = 6; i >= 0; i--){
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(localDateStr(d));
    }
    const weekTotal = days.reduce((sum, d) => sum + (byDate[d] || 0), 0);
    statWeek.textContent = fmtMinutes(weekTotal);

    let streak = 0;
    let cursor = new Date();
    if (!byDate[localDateStr(cursor)]) cursor.setDate(cursor.getDate() - 1); // allow streak to count from yesterday if nothing logged yet today
    while (byDate[localDateStr(cursor)]){
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    statStreak.textContent = streak;

    const maxVal = Math.max(1, ...days.map(d => byDate[d] || 0));
    const labels = ['S','M','T','W','T','F','S'];
    barsEl.innerHTML = '';
    days.forEach((d, i) => {
      const val = byDate[d] || 0;
      const dow = new Date(d + 'T00:00:00').getDay();
      const col = document.createElement('div');
      col.className = 'bar-col';
      const bar = document.createElement('div');
      bar.className = 'bar' + (d === today ? ' today' : '');
      bar.style.height = Math.max(3, (val / maxVal) * 60) + 'px';
      const label = document.createElement('span');
      label.textContent = labels[dow];
      col.appendChild(bar);
      col.appendChild(label);
      barsEl.appendChild(col);
    });

    renderHeatmap(byDate);
    renderHistory();
  }

  function renderHeatmap(byDate){
    const grid = document.getElementById('heatmapGrid');
    grid.innerHTML = '';

    const WEEKS = 14;
    const today = new Date();
    const end = new Date(today);
    end.setDate(end.getDate() + (6 - end.getDay())); // roll forward to this week's Saturday
    const start = new Date(end);
    start.setDate(start.getDate() - (WEEKS * 7 - 1));
    while (start.getDay() !== 0) start.setDate(start.getDate() - 1); // back up to a Sunday

    const maxVal = Math.max(1, ...Object.values(byDate));
    const todayStr = localDateStr(today);
    let cursor = new Date(start);

    while (cursor <= end){
      const ds = localDateStr(cursor);
      const val = byDate[ds] || 0;
      const level = val > 0 ? Math.min(4, Math.max(1, Math.ceil((val / maxVal) * 4))) : 0;

      const cell = document.createElement('div');
      cell.className = 'hm-cell';
      cell.dataset.level = level;
      const dateLabel = cursor.toLocaleDateString(undefined, { month:'short', day:'numeric' });
      cell.title = dateLabel + (ds === todayStr ? ' (today)' : '') + ' — ' + (val ? fmtMinutes(val) : 'no sessions');
      if (cursor > today) cell.style.visibility = 'hidden';
      grid.appendChild(cell);

      cursor.setDate(cursor.getDate() + 1);
    }
  }

  // ---------- History ----------
  const historyToggle = document.getElementById('historyToggle');
  const historyList = document.getElementById('historyList');
  historyToggle.addEventListener('click', (e) => {
    if (e.target.closest('#clearHistoryBtn')) return;
    historyToggle.classList.toggle('open');
    historyList.classList.toggle('open');
  });
  document.getElementById('clearHistoryBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (!sessions.length) return;
    if (confirm('Clear all logged sessions? This can\'t be undone.')){
      sessions = [];
      saveSessions();
      refreshStats();
    }
  });

  function renderHistory(){
    historyList.innerHTML = '';
    if (!sessions.length){
      historyList.innerHTML = '<div class="history-empty">No sessions logged yet — finish a focus timer to see it here.</div>';
      return;
    }
    const recent = sessions.slice().reverse().slice(0, 40);
    recent.forEach(s => {
      const row = document.createElement('div');
      row.className = 'history-row';
      const dt = new Date(s.timestamp);
      const timeStr = dt.toLocaleDateString(undefined, { month:'short', day:'numeric' }) + ' · ' + dt.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
      row.innerHTML = `
        <div><div class="subj">${escapeHtml(s.subject)}</div><div class="meta">${timeStr}</div></div>
        <div class="right"><span class="mins">${s.minutes}m</span>
          <button title="Delete entry" data-ts="${s.timestamp}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>`;
      historyList.appendChild(row);
    });
    historyList.querySelectorAll('button[data-ts]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ts = Number(btn.dataset.ts);
        sessions = sessions.filter(s => s.timestamp !== ts);
        saveSessions();
        refreshStats();
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Dark mode ----------
  const darkBtn = document.getElementById('darkBtn');
  darkBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    darkBtn.classList.toggle('active', !isDark);
  });

  // ---------- Init ----------
  setPhaseVisuals();
  updateDisplay();
  renderDots();
  syncButton();
  refreshStats();
</script>
</body>
</html>
