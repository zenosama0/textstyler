<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stylers - Text Formatting Tools</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4A3AFF">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stylers">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Anti-flash theming: applied before first paint so returning visitors
  // never see a flicker of the default light/indigo theme before their
  // saved dark mode / accent color kicks in.
  (function(){
    try{
      var t = localStorage.getItem('stylersHub_theme');
      if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      var a = localStorage.getItem('stylersHub_accent');
      if(a){
        document.documentElement.style.setProperty('--accent', a);
        var hex = a.replace('#','');
        var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
        var isDark = t === 'dark';
        document.documentElement.style.setProperty('--accent-soft', 'rgba('+r+','+g+','+b+','+(isDark?0.22:0.14)+')');
      }
    }catch(e){}
  })();
</script>
<style>
  :root{
    --bg:#F6F5F1;
    --dot:#DEDCD3;
    --ink:#22252B;
    --muted:#767A73;
    --accent:#4A3AFF;
    --accent-soft:#EDEBFF;
    --card:#FFFFFF;
    --line:#E4E2D9;
    --titlebar-h:env(titlebar-area-height, 33px);
  }
  [data-theme="dark"]{
    --bg:#17181B;
    --dot:#232529;
    --ink:#EDEDEE;
    --muted:#8C9096;
    --accent:#8B7FFF;
    --accent-soft:#2A2452;
    --card:#202226;
    --line:#2C2E33;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(var(--dot) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }

  /* ---------- Custom title bar (Window Controls Overlay) ---------- */
  /* Only shown when the app is installed and running on a platform
     (Windows/Chromium) that supports drawing your own title bar in
     the OS caption area. Everywhere else this stays hidden and the
     page looks exactly as before. */
  .titlebar{
    display:none;
    position:fixed;
    top:0; left:0; right:0;
    height:var(--titlebar-h);
    min-height:33px;
    -webkit-app-region:drag;
    app-region:drag;
    background:var(--card);
    border-bottom:1.5px solid var(--ink);
    z-index:1000;
    align-items:center;
    gap:8px;
    padding-left:max(env(titlebar-area-x, 12px), 12px);
    padding-right:calc(100% - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100%) + 12px);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--ink);
    -webkit-user-select:none;
    user-select:none;
    transition:background .2s ease, border-color .2s ease;
  }
  body.has-wco .titlebar{ display:flex; }
  body.has-wco{ padding-top:var(--titlebar-h); }

  .titlebar .mark{
    width:14px; height:14px; border-radius:4px;
    background:var(--accent);
    flex-shrink:0;
    transition:background .2s ease;
  }
  .titlebar .tb-title{ color:var(--ink); }
  .titlebar .tb-title span{ color:var(--muted); font-weight:400; }

  /* Interactive controls inside the title bar must opt out of dragging */
  .titlebar a, .titlebar button{
    -webkit-app-region:no-drag;
    app-region:no-drag;
  }

  .wrap{ max-width:920px; margin:0 auto; padding:56px 24px 80px; }

  header{ margin-bottom:44px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .header-text{ flex:1; min-width:220px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
    background:var(--accent-soft); padding:5px 10px; border-radius:20px;
    margin-bottom:16px;
    transition:background .15s ease, color .15s ease;
  }
  .eyebrow::before{ content:"●"; font-size:0.6rem; }

  h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:2.6rem;
    letter-spacing:-0.02em; margin:0 0 10px; line-height:1.08;
  }
  header p{
    color:var(--muted); font-size:1.02rem; max-width:46ch; margin:0; line-height:1.55;
  }

  .install-btn{
    display:none; align-items:center; gap:8px; flex-shrink:0;
    font-family:'Source Sans 3', sans-serif; font-weight:600; font-size:0.85rem;
    padding:10px 16px; border-radius:9px; border:1.5px solid var(--ink);
    background:var(--ink); color:var(--bg); cursor:pointer;
    box-shadow:3px 3px 0 var(--line); margin-top:2px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .install-btn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--accent); }
  .install-btn.show{ display:inline-flex; }
  .install-btn svg{ width:16px; height:16px; flex-shrink:0; }

  .header-actions{ display:flex; align-items:flex-start; gap:8px; position:relative; }

  .iconbtn{
    width:38px; height:38px; flex-shrink:0; border-radius:9px;
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:3px 3px 0 var(--line); margin-top:2px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .iconbtn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--accent); border-color:var(--accent); }
  .iconbtn:active{ transform:translate(0,0); box-shadow:2px 2px 0 var(--line); }
  .iconbtn svg{ width:17px; height:17px; }
  .iconbtn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------- Accent color popover ---------- */
  .theme-wrap{ position:relative; }
  .popover{
    position:absolute; top:calc(100% + 8px); right:0; z-index:50;
    min-width:236px; background:var(--card); border:1.5px solid var(--ink);
    border-radius:12px; box-shadow:4px 4px 0 var(--line); padding:14px;
    display:none; flex-direction:column; gap:10px;
    animation:popIn .14s ease-out;
    transition:background .2s ease, border-color .2s ease;
  }
  .popover.show{ display:flex; }
  @keyframes popIn{ from{ opacity:0; transform:scale(.95) translateY(-4px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .popover-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted);
  }
  .swatch-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .swatch{
    width:28px; height:28px; border-radius:9px; border:1.5px solid var(--ink);
    cursor:pointer; padding:0; position:relative; flex-shrink:0;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .swatch:hover{ transform:translateY(-2px); box-shadow:2px 2px 0 var(--line); }
  .swatch.active::after{
    content:""; position:absolute; inset:-4px; border-radius:11px; border:1.5px solid var(--ink);
  }
  .swatch.reset{
    background:
      linear-gradient(to bottom right, transparent calc(50% - 1px), var(--muted), transparent calc(50% + 1px)),
      var(--card);
  }
  .swatch.custom-toggle{
    background:var(--card); display:flex; align-items:center; justify-content:center; color:var(--ink);
    border-style:dashed;
  }
  .swatch.custom-toggle svg{ width:14px; height:14px; }
  .custom-row{ display:none; gap:6px; }
  .custom-row.show{ display:flex; }
  .custom-row input{
    flex:1; min-width:0; padding:7px 9px; border:1.5px solid var(--line); border-radius:7px;
    font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:var(--ink); background:var(--bg);
    outline:none; transition:border-color .12s ease;
  }
  .custom-row input:focus{ border-color:var(--accent); }
  .custom-row input.invalid{ border-color:#E8467C; }

  .ios-hint{
    display:none; align-items:flex-start; gap:8px; font-size:0.8rem; color:var(--muted);
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; max-width:230px; margin-top:2px;
  }
  .ios-hint.show{ display:flex; }
  .ios-hint svg{ width:15px; height:15px; flex-shrink:0; margin-top:1px; color:var(--accent); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
  }

  .card{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:12px;
    padding:22px 20px 20px;
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    gap:26px;
    min-height:150px;
    box-shadow:3px 3px 0 var(--line);
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease, border-color .2s ease;
  }
  .card:hover{
    transform:translate(-2px,-2px);
    box-shadow:6px 6px 0 var(--accent);
    border-color:var(--accent);
  }
  .card:hover .tag{ background:var(--accent); color:#fff; }
  .card:hover .go{ color:var(--accent); }

  .tag{
    align-self:flex-start;
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; font-weight:600;
    background:var(--ink); color:var(--bg);
    padding:3px 9px; border-radius:5px;
    transition:background .15s ease;
  }

  .card-body h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.28rem;
    margin:0 0 4px; letter-spacing:-0.01em;
  }
  .card-body p{
    font-family:'IBM Plex Mono', monospace; font-size:0.74rem;
    color:var(--muted); margin:0;
  }

  .go{
    margin-top:auto;
    font-size:0.85rem; font-weight:600; color:var(--muted);
    display:flex; align-items:center; gap:6px;
    transition:color .15s ease;
  }
  .go::after{ content:"→"; transition:transform .15s ease; }
  .card:hover .go::after{ transform:translateX(3px); }

  .empty{
    grid-column:1/-1;
    border:1.5px dashed var(--line); border-radius:12px;
    padding:34px 20px; text-align:center; color:var(--muted);
  }

  .add-card{
    display:flex; align-items:center; justify-content:center;
    border:1.5px dashed var(--line); border-radius:12px;
    color:var(--muted); font-size:0.85rem; text-align:center;
    padding:22px 18px; min-height:150px; line-height:1.5;
  }
  .add-card code{
    font-family:'IBM Plex Mono', monospace; background:var(--accent-soft);
    color:var(--accent); padding:1px 6px; border-radius:4px; font-size:0.8em;
  }

  footer{
    margin-top:50px; color:var(--muted); font-size:0.8rem;
    border-top:1px solid var(--line); padding-top:18px;
  }

  @media (max-width:520px){
    h1{ font-size:2.1rem; }
    .wrap{ padding:40px 18px 60px; }
  }
</style>
</head>
<body>
  <!-- Custom title bar: only appears when installed on Windows/Chromium
       with Window Controls Overlay support. Hidden everywhere else. -->
  <div class="titlebar" id="titlebar">
    <span class="mark"></span>
    <span class="tb-title">Stylers <span>— Text Formatting Tools</span></span>
  </div>

  <div class="wrap">
    <header>
      <div class="header-text">
        <span class="eyebrow">Stylers</span>
        <h1>Text Stylers Hub</h1>
        <p>A small toolbox of one-page formatters - paste text, get something worth reading.</p>
      </div>
      <div>
        <div class="header-actions">
          <button class="install-btn" id="installBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
            Install app
          </button>
          <div class="theme-wrap">
            <button class="iconbtn" id="paletteBtn" title="Accent color">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.4-4-8-10-8z"/></svg>
            </button>
            <div class="popover" id="palettePopover">
              <div class="popover-label">Accent color</div>
              <div class="swatch-row" id="swatchRow">
                <button class="swatch reset" id="resetSwatch" type="button" data-hex="" title="Theme default"></button>
                <button class="swatch custom-toggle" id="customToggleBtn" type="button" title="Custom color">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                </button>
              </div>
              <div class="custom-row" id="customRow">
                <input type="text" id="customColorInput" placeholder="#4A3AFF or rgb(74,58,255)" spellcheck="false">
              </div>
            </div>
          </div>
          <button class="iconbtn" id="darkBtn" title="Toggle dark mode">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          </button>
        </div>
        <div class="ios-hint" id="iosHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
          <span>To install: tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</span>
        </div>
      </div>
    </header>

    <div id="grid" class="grid"></div>

    <footer>Add a new tool: drop the <code style="font-family:'IBM Plex Mono',monospace">.html</code> file in <code style="font-family:'IBM Plex Mono',monospace">/stylers</code> and add its filename to the list in <code style="font-family:'IBM Plex Mono',monospace">index.html</code>.</footer>
  </div>

<script>
  // Add each new styler's filename here (must live inside ./stylers/)
  const STYLERS = [
    'MD_Styler.html',
    'StudyFlow.html',
    'PDF_Reader.html',
    'Flashcards.html',
    'Read_Aloud.html',
    'Mind_Map.html',
    'Citation_Formatter.html',
    'Quiz_Mode.html',
    'Exam_Routine.html',
    'HTML_Playground.html'
  ];

  function toTitle(filename){
    return filename.replace(/\.html$/i, '').replaceAll('_', ' ');
  }

  function tagFor(index){
    return String(index + 1).padStart(2, '0');
  }

  const grid = document.getElementById('grid');

  if (STYLERS.length === 0){
    grid.innerHTML = '<div class="empty">No stylers yet — add .html files to /stylers and list them in index.html.</div>';
  } else {
    STYLERS.forEach((file, i) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = './stylers/' + file;

      a.innerHTML = `
        <span class="tag">${tagFor(i)}</span>
        <div class="card-body">
          <h2>${toTitle(file)}</h2>
          <p>${file}</p>
        </div>
        <span class="go">Open</span>
      `;
      grid.appendChild(a);
    });

    //const addCard = document.createElement('div');
    //addCard.className = 'add-card';
    //addCard.innerHTML = 'Drop a new .html file in <code>/stylers</code>, then add its name to the list';
    //grid.appendChild(addCard);
  }

  // ---------- Install as app ----------
  const installBtn = document.getElementById('installBtn');
  const iosHint = document.getElementById('iosHint');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.remove('show');
  });

  window.addEventListener('appinstalled', () => {
    installBtn.classList.remove('show');
    iosHint.classList.remove('show');
  });

  // iOS Safari has no beforeinstallprompt — show manual instructions instead,
  // but only if it's not already running as an installed app
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isIOS && !isStandalone) iosHint.classList.add('show');

  // ---------- Dark mode (persisted) ----------
  // data-theme may already have been set by the anti-flash script in <head>
  // if a saved preference exists; here we just wire up the toggle button.
  const darkBtn = document.getElementById('darkBtn');
  function setDarkActive(){
    darkBtn.classList.toggle('active', document.documentElement.getAttribute('data-theme') === 'dark');
  }
  setDarkActive();
  darkBtn.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('stylersHub_theme', next); }catch(e){}
    setDarkActive();
    refreshAccentVars(); // accent-soft opacity differs slightly per theme
  });

  // ---------- Accent color system (persisted) ----------
  const PRESET_ACCENTS = ['#4A3AFF', '#FF6B4A', '#12A594', '#E14C86', '#2E9E5B', '#E2A63A'];
  let customAccentHex = null;
  try{ customAccentHex = localStorage.getItem('stylersHub_accent') || null; }catch(e){}

  function hexToRgb(hex){
    hex = hex.replace('#','');
    return { r: parseInt(hex.substring(0,2),16), g: parseInt(hex.substring(2,4),16), b: parseInt(hex.substring(4,6),16) };
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('').toUpperCase();
  }
  // Auto-detects hex ("#4A3AFF", "4A3AFF", "#48F") or rgb()/rgba() input.
  function parseColorInput(str){
    str = (str || '').trim();
    if(!str) return null;
    const rgbMatch = str.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*(?:,\s*[\d.]+\s*)?\)$/i);
    if(rgbMatch){
      const r = +rgbMatch[1], g = +rgbMatch[2], b = +rgbMatch[3];
      if(r > 255 || g > 255 || b > 255) return null;
      return rgbToHex(r, g, b);
    }
    let hex = str.replace(/^#/, '');
    if(/^[0-9a-f]{3}$/i.test(hex)) hex = hex.split('').map(c => c + c).join('');
    if(/^[0-9a-f]{6}$/i.test(hex)) return '#' + hex.toUpperCase();
    return null;
  }
  function refreshAccentVars(){
    if(!customAccentHex){
      document.documentElement.style.removeProperty('--accent');
      document.documentElement.style.removeProperty('--accent-soft');
      return;
    }
    const rgb = hexToRgb(customAccentHex);
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.style.setProperty('--accent', customAccentHex);
    document.documentElement.style.setProperty('--accent-soft', `rgba(${rgb.r},${rgb.g},${rgb.b},${isDark ? 0.22 : 0.14})`);
  }
  function applyAccent(hex){
    customAccentHex = hex;
    try{
      if(hex) localStorage.setItem('stylersHub_accent', hex);
      else localStorage.removeItem('stylersHub_accent');
    }catch(e){}
    refreshAccentVars();
    renderSwatchState();
  }
  refreshAccentVars();

  const swatchRow = document.getElementById('swatchRow');
  const customToggleBtn = document.getElementById('customToggleBtn');
  const resetSwatch = document.getElementById('resetSwatch');

  PRESET_ACCENTS.forEach(hex => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.style.background = hex;
    b.dataset.hex = hex;
    b.title = hex;
    b.addEventListener('click', () => applyAccent(hex));
    swatchRow.insertBefore(b, customToggleBtn);
  });
  resetSwatch.addEventListener('click', () => applyAccent(null));

  function renderSwatchState(){
    swatchRow.querySelectorAll('.swatch:not(.custom-toggle)').forEach(el => {
      const hex = el.dataset.hex || null;
      el.classList.toggle('active', hex === customAccentHex);
    });
  }
  renderSwatchState();

  // Popover open/close + custom color input
  const paletteBtn = document.getElementById('paletteBtn');
  const palettePopover = document.getElementById('palettePopover');
  const customRow = document.getElementById('customRow');
  const customColorInput = document.getElementById('customColorInput');

  paletteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    palettePopover.classList.toggle('show');
  });
  document.addEventListener('click', (e) => {
    if(!palettePopover.contains(e.target) && e.target !== paletteBtn){
      palettePopover.classList.remove('show');
    }
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') palettePopover.classList.remove('show');
  });
  customToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    customRow.classList.toggle('show');
    if(customRow.classList.contains('show')){
      customColorInput.value = customAccentHex || '';
      customColorInput.focus();
    }
  });
  function tryApplyCustom(){
    const parsed = parseColorInput(customColorInput.value);
    customColorInput.classList.toggle('invalid', !!customColorInput.value.trim() && !parsed);
    if(parsed) applyAccent(parsed);
  }
  customColorInput.addEventListener('input', tryApplyCustom);
  customColorInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); tryApplyCustom(); }
  });

  // If the saved accent isn't one of the presets, it was a custom value —
  // pre-open the custom row so a returning visitor can see/edit it.
  if(customAccentHex && !PRESET_ACCENTS.includes(customAccentHex)){
    customRow.classList.add('show');
    customColorInput.value = customAccentHex;
  }

  // ---------- Custom title bar (Window Controls Overlay) ----------
  // Chromium on Windows can hand the OS caption area to the page itself
  // once "window-controls-overlay" is requested in the manifest and the
  // app is installed. When that happens we show our own bar and pad the
  // body so content doesn't sit underneath it. On every other platform
  // (Mac, Linux, mobile, or an un-installed tab) none of this fires and
  // the page renders exactly as before.
  function syncTitlebar(){
    const active = !!(navigator.windowControlsOverlay && navigator.windowControlsOverlay.visible);
    document.body.classList.toggle('has-wco', active);
  }
  if ('windowControlsOverlay' in navigator){
    syncTitlebar();
    navigator.windowControlsOverlay.addEventListener('geometrychange', syncTitlebar);
  }

  // ---------- Service worker (offline + installability) ----------
  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
