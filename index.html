<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stylers - Text Formatting Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F1;
    --dot:#DEDCD3;
    --ink:#22252B;
    --muted:#767A73;
    --accent:#4A3AFF;
    --accent-soft:#EDEBFF;
    --card:#FFFFFF;
    --line:#E4E2D9;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(var(--dot) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:56px 24px 80px; }

  header{ margin-bottom:44px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
    background:var(--accent-soft); padding:5px 10px; border-radius:20px;
    margin-bottom:16px;
  }
  .eyebrow::before{ content:"●"; font-size:0.6rem; }

  h1{
    font-family:'Fraunces', serif; font-weight:700; font-size:2.6rem;
    letter-spacing:-0.02em; margin:0 0 10px; line-height:1.08;
  }
  header p{
    color:var(--muted); font-size:1.02rem; max-width:46ch; margin:0; line-height:1.55;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
  }

  .card{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:12px;
    padding:22px 20px 20px;
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    gap:26px;
    min-height:150px;
    box-shadow:3px 3px 0 var(--line);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translate(-2px,-2px);
    box-shadow:6px 6px 0 var(--accent);
    border-color:var(--accent);
  }
  .card:hover .tag{ background:var(--accent); color:#fff; }
  .card:hover .go{ color:var(--accent); }

  .tag{
    align-self:flex-start;
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; font-weight:600;
    background:var(--ink); color:var(--bg);
    padding:3px 9px; border-radius:5px;
    transition:background .15s ease;
  }

  .card-body h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.28rem;
    margin:0 0 4px; letter-spacing:-0.01em;
  }
  .card-body p{
    font-family:'IBM Plex Mono', monospace; font-size:0.74rem;
    color:var(--muted); margin:0;
  }

  .go{
    margin-top:auto;
    font-size:0.85rem; font-weight:600; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .go::after{ content:"→"; transition:transform .15s ease; }
  .card:hover .go::after{ transform:translateX(3px); }

  .empty{
    grid-column:1/-1;
    border:1.5px dashed var(--line); border-radius:12px;
    padding:34px 20px; text-align:center; color:var(--muted);
  }

  .add-card{
    display:flex; align-items:center; justify-content:center;
    border:1.5px dashed var(--line); border-radius:12px;
    color:var(--muted); font-size:0.85rem; text-align:center;
    padding:22px 18px; min-height:150px; line-height:1.5;
  }
  .add-card code{
    font-family:'IBM Plex Mono', monospace; background:var(--accent-soft);
    color:var(--accent); padding:1px 6px; border-radius:4px; font-size:0.8em;
  }

  footer{
    margin-top:50px; color:var(--muted); font-size:0.8rem;
    border-top:1px solid var(--line); padding-top:18px;
  }

  @media (max-width:520px){
    h1{ font-size:2.1rem; }
    .wrap{ padding:40px 18px 60px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">Stylers</span>
      <h1>Text Stylers Hub</h1>
      <p>A small toolbox of one-page formatters - paste text, get something worth reading.</p>
    </header>

    <div id="grid" class="grid"></div>

    <footer>(Note to self) Add a new tool: drop the <code style="font-family:'IBM Plex Mono',monospace">.html</code> file in <code style="font-family:'IBM Plex Mono',monospace">/stylers</code> and add its filename to the list in <code style="font-family:'IBM Plex Mono',monospace">index.html</code>.</footer>
  </div>

<script>
  // Add each new styler's filename here (must live inside ./stylers/)
  const STYLERS = [
    'MD_Styler.html',
    'StudyFlow.html',
    'PDF_Reader.html'
  ];

  function toTitle(filename){
    return filename.replace(/\.html$/i, '').replaceAll('_', ' ');
  }

  function tagFor(index){
    return String(index + 1).padStart(2, '0');
  }

  const grid = document.getElementById('grid');

  if (STYLERS.length === 0){
    grid.innerHTML = '<div class="empty">No stylers yet — add .html files to /stylers and list them in index.html.</div>';
  } else {
    STYLERS.forEach((file, i) => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = './stylers/' + file;

      a.innerHTML = `
        <span class="tag">${tagFor(i)}</span>
        <div class="card-body">
          <h2>${toTitle(file)}</h2>
          <p>${file}</p>
        </div>
        <span class="go">Open</span>
      `;
      grid.appendChild(a);
    });

    const addCard = document.createElement('div');
    addCard.className = 'add-card';
    addCard.innerHTML = 'Drop a new .html file in <code>/stylers</code>, then add its name to the list';
    grid.appendChild(addCard);
  }
</script>
</body>
</html>
